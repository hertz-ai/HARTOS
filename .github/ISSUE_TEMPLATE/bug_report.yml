name: Bug report
description: Something behaves differently from how it is documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do **not** belong here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        Exact steps or commands. If it only happens sometimes, say how often —
        an intermittent bug is a different investigation from a deterministic
        one, and knowing which saves a reviewer a day.
      placeholder: |
        1. Start with `python -m hart_intelligence_entry`
        2. POST to :6777/v1/chat/completions with ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: Topology
      description: A lot of code paths branch on this.
      options:
        - flat (single machine, SQLite)
        - regional (LAN/VPN cluster, MySQL)
        - central (cloud, Docker)
        - not sure
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS, Python version, GPU/VRAM
      description: >
        Engines are tiered on VRAM, so "6GB" and "8GB" are genuinely
        different products. "CPU only" is a valid answer.
      placeholder: "Ubuntu 24.04, Python 3.10.14, RTX 3060 12GB"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the text, not a screenshot of it. Redact any API keys.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: This is not a security vulnerability
          required: true
