name: VLM Grounding Gate

# Closes part of #462 — runs the gate-library tests on every PR touching
# VLM code, so aggregator / comparison logic regressions get caught at
# PR time instead of going silent until someone manually invokes
# `python tests/vlm_grounding_benchmark.py --gate` on a dev machine.
#
# SCOPE NOTE — what this DOES and DOES NOT cover:
#   ✅ Locks vlm_gate_lib.py contract (summarize_bucket, compare_buckets,
#      compare_attribution, compare_router_decisions render_baseline_md).
#      28 unit tests in tests/unit/test_vlm_gate.py.
#   ✅ Catches accidental aggregator drift (the kind that broke the
#      sort key in vlm_gate_lib history — single source of truth).
#   ✅ Verifies tests/vlm_benchmark_baseline.json parses + has the
#      expected shape so a corrupted baseline commit fails at PR time.
#   ✅ AST-checks vlm_grounding_benchmark.py so syntax breaks fail PR.
#   ❌ Does NOT run the actual VLM benchmark end-to-end — that needs
#      a real screen (ImageGrab.grab at module load) which a headless
#      runner can't provide.  Full benchmark CI is a follow-up that
#      requires the fixture-mode refactor (`--fixture-dir`).
#
# Cost: $0 — public-repo unlimited free `ubuntu-latest` minutes.
# Wall-clock: ~30s per PR.
#
# Model is NEVER hardcoded in source.  Production reads from
# ModelCatalog / HEVOLVE_VLM_MODEL_NAME env var.  When the full
# benchmark gets wired up in CI later, the workflow YAML — not source
# code — names the small CI-only model (e.g. Qwen3-VL-0.5B-Q4_K_M).

on:
  push:
    branches: [main]
    paths:
      - 'integrations/vlm/**'
      - 'integrations/remote_desktop/window_capture.py'
      - 'tests/vlm_grounding_benchmark.py'
      - 'tests/vlm_gate_lib.py'
      - 'tests/vlm_benchmark_baseline.json'
      - 'tests/unit/test_vlm_gate.py'
      - '.github/workflows/vlm-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/vlm/**'
      - 'integrations/remote_desktop/window_capture.py'
      - 'tests/vlm_grounding_benchmark.py'
      - 'tests/vlm_gate_lib.py'
      - 'tests/vlm_benchmark_baseline.json'
      - 'tests/unit/test_vlm_gate.py'
      - '.github/workflows/vlm-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # cheap gate, supersede freely.
  # Same shape as nix-check/coverage-baseline (3f5ee290): a manual
  # workflow_dispatch gets its OWN group keyed by run id, so an
  # on-demand run is never cancelled by an unrelated later push.
  group: vlm-gate-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  gate-lib-tests:
    name: Gate Library Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run gate-library unit tests
        # Pure-Python aggregator + comparison helpers; no display, no
        # model, no llama-server.  Covers the contract that --gate
        # depends on at runtime.
        run: |
          cd tests
          python -m unittest unit.test_vlm_gate -v

  benchmark-syntax-check:
    name: Benchmark File Syntax + Baseline Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: AST-parse the benchmark file
        # Catches syntax breaks without needing the runtime env (PIL,
        # pyautogui, requests, llama-server) that the benchmark would
        # otherwise pull in at import time.
        run: |
          python -c "
          import ast
          ast.parse(open('tests/vlm_grounding_benchmark.py', encoding='utf-8').read())
          print('vlm_grounding_benchmark.py: AST OK')
          "

      - name: Validate baseline JSON shape
        # The gate compares current-run JSON to this baseline.  If the
        # baseline file gets corrupted in a commit (truncated, wrong
        # encoding, malformed), the gate would silently misbehave.
        # Validate the structure we depend on at PR time.
        run: |
          python -c "
          import json
          with open('tests/vlm_benchmark_baseline.json', encoding='utf-8') as f:
              b = json.load(f)
          assert isinstance(b, dict), 'baseline must be a dict'
          required = {'screen', 'image', 'timestamp', 'results',
                      'method_results', 'router_results', 'exec_test_results'}
          missing = required - set(b.keys())
          assert not missing, f'baseline missing required keys: {missing}'
          assert isinstance(b['results'], list), 'results must be a list'
          assert isinstance(b['method_results'], list), 'method_results must be a list'
          print(f'vlm_benchmark_baseline.json: schema OK (timestamp: {b[\"timestamp\"]})')
          "
