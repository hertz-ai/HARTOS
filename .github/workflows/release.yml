name: Release — Build, Sign, ISO, Torrent, Pages

# Trigger: manual dispatch with version, or push to main (for ISO builds)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 — without "v" prefix)'
        required: true
        type: string
      build_iso:
        description: 'Build ISOs and torrents'
        type: boolean
        default: true
  push:
    branches: [main, gpt4.1, develop, debug_1, fix/boot-issues-nouveau-firstboot]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ═══════════════════════════════════════════════════════════
  # 1. Comprehensive gate — the release-blocking checks (PARALLEL to build-iso)
  # ═══════════════════════════════════════════════════════════
  # Runs the FULL gate via the reusable flake-checks workflow:
  #   * pytest tests/unit + tests/functional (the Python runtime),
  #   * the compositor cargo test (default pure-logic floor),
  #   * `nix build .#hart-comp` (the smithay feature: compile + cargo test via
  #     doCheck) + the Rust precedent,
  #   * EVERY nixosTest in checks.x86_64-linux, actually RUN (sharded), enumerated
  #     dynamically so a new test gates the build automatically.
  #
  # It is a DEDICATED job on its OWN runners/budgets, NOT serial inside build-iso's
  # 6h wall-clock — the heavy VM suite runs in parallel with the ISO build. Both
  # `tag-and-sign` (signed release) and `publish-nightly` (nightly .iso) NEED this:
  # nothing ships unless every check here is GREEN. The same workflow runs
  # standalone on PRs, so the gate is defined exactly ONCE (DRY).
  #
  # Scoped to the events whose downstream job actually CONSUMES it — a manual
  # dispatch (gates tag-and-sign) or a push to main (gates publish-nightly). On a
  # push to a non-main branch nothing depends on it (publish-nightly is main-only,
  # tag-and-sign is dispatch-only), so running the multi-hour VM suite there would
  # be pure waste. PRs are still fully gated by flake-checks.yml's own
  # pull_request trigger. A skipped gate-checks here correctly skips its
  # main-only/dispatch-only dependents too (no always() anywhere downstream).
  gate-checks:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/flake-checks.yml

  # ═══════════════════════════════════════════════════════════
  # 2. Tag + Sign (only on manual dispatch with version)
  # ═══════════════════════════════════════════════════════════
  tag-and-sign:
    if: github.event_name == 'workflow_dispatch'
    # GATED on the FULL check suite (was: only the unit `test` job). No tag is
    # pushed — and therefore release-sign.yml never master-key-signs a manifest —
    # unless every unit/cargo/nix/compositor check is green.
    needs: gate-checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must be semver (e.g. 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag does not exist
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: Tag v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          # Tag push triggers release-sign.yml for Ed25519 manifest signing

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Python distribution
        run: |
          pip install build setuptools-scm
          python -m build

      - name: Build universal installers
        run: |
          cd deploy/installer
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/hevolve-install.exe .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/hevolve-install-macos .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/hevolve-install-linux .
          ls -lh dist/

      - name: Strip HevolveAI source from wheel
        run: |
          # Install HevolveAI (transitive dep) so compile script can find it
          pip install -e . --no-deps 2>/dev/null || true
          # Compile HevolveAI .py → .pyc and strip source
          python scripts/compile_hevolveai.py --strip-source \
            --output-dir /tmp/hevolveai_compiled \
            --manifest-out dist/hevolveai_manifest.json || echo "HevolveAI not installed — skipping"
          # Repack the wheel with compiled-only HevolveAI stubs
          python scripts/build_compiled_wheel.py || echo "Compiled wheel build skipped"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "HART OS v${{ steps.version.outputs.version }}"
          files: |
            dist/*.whl
            dist/*.tar.gz
            deploy/installer/dist/hevolve-install.exe
            deploy/installer/dist/hevolve-install-macos
            deploy/installer/dist/hevolve-install-linux
          body: |
            ## HART OS v${{ steps.version.outputs.version }}

            Hevolve Hive Agentic Runtime — crowdsourced compute for autonomous AI training.

            ### Downloads

            | Format | Description |
            |--------|-------------|
            | `.whl` | Python wheel (pip install) |
            | `.tar.gz` | Source distribution |
            | `.iso` | Bootable installer (see ISO job below) |
            | `.torrent` | P2P download (web-seeded via GitHub CDN) |

            ### Verify

            ```bash
            # Check SHA-256
            sha256sum -c hart-os-*.sha256

            # Verify release signature (Ed25519)
            python -c "from security.master_key import verify_release_manifest; \
              import json; m = json.load(open('release_manifest.json')); \
              print('VALID' if verify_release_manifest(m) else 'INVALID')"
            ```
          generate_release_notes: true

  # ═══════════════════════════════════════════════════════════
  # 3. Build ISOs + Torrents (parallel matrix)
  # ═══════════════════════════════════════════════════════════
  build-iso:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_iso == 'true') ||
      (github.event_name == 'push')
    # ISO build runs independently — tests run in parallel, don't block ISO
    runs-on: ubuntu-latest
    # iso-desktop consistently hits the 90-min cap (run 24634878558
    # cancelled at 90m17s mid-build) — the glibcLocales overlay forces
    # a from-source rebuild that cache.nixos.org can't serve, adding
    # ~30 min to the baseline. iso-server/iso-edge stay well under
    # 15 min so bumping the shared cap doesn't waste any runner time
    # on the fast variants.
    # 300 (was 180): raw-desktop needs more than iso-desktop — make-disk-image
    # copies the whole ~20 GB closure into an ext4 inside a VM (slow I/O) on
    # top of the same closure build; the 2026-07-16 first attempt (run
    # 29509018080) was CANCELLED at the 180-min wall. The fast variants finish
    # in ~15 min regardless, so the higher shared cap costs nothing there and
    # only pays out on hangs.
    timeout-minutes: 300
    # raw-desktop (the INSTALLED writable-root image, 2026-07-16) must NEVER
    # block the nightly: publish-nightly `needs: build-iso`, and a failed matrix
    # leg fails the whole job for `needs` purposes. Per-leg continue-on-error
    # keeps a red raw build from holding back the ISO nightlies while the raw
    # pipeline matures.
    continue-on-error: ${{ matrix.target == 'raw-desktop' }}
    strategy:
      fail-fast: false
      matrix:
        target: [iso-server, iso-desktop, iso-edge, raw-desktop]
    steps:
      - uses: actions/checkout@v4

      # raw-* only: put the ENTIRE nix store on the runner's second, nearly
      # empty ~65 GB data disk (/mnt). The raw build's peak — the ~20 GB
      # closure PLUS the ~20 GB disk-image output, both in the store — cannot
      # fit the root disk no matter how much preinstalled bloat is stripped
      # (2026-07-16 run 29522446118: ENOSPC crashed the nix daemon itself at
      # 50 min, AFTER the hostedtoolcache purge). Bind-mounting /nix onto /mnt
      # BEFORE the installer splits the load: store+image on /mnt (~65 GB),
      # while build tmp, the xz and the split parts keep the root disk's
      # ~45 GB. The ISO legs stay on the root disk unchanged (their squashfs
      # peak fits and their cache behaviour is proven).
      - name: Move /nix to the /mnt data disk (raw only)
        if: startsWith(matrix.target, 'raw-')
        run: |
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          df -h / /mnt

      # raw-* only: make /dev/kvm usable by the nix build sandbox BEFORE the
      # installer runs (it detects kvm at install time). Without it,
      # make-disk-image's qemu assembles the ~20 GB ext4 under TCG software
      # emulation: run 29551668370 spent 4h15m inside nixos-disk-image.drv
      # (closure done in 30 min) and STILL hit the 5h wall. This is the
      # GitHub-documented KVM enable recipe (same one Android-emulator jobs
      # use); with -enable-kvm the image step is minutes, not hours.
      - name: Enable KVM for the image-assembly VM (raw only)
        if: startsWith(matrix.target, 'raw-')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            narinfo-cache-negative-ttl = 0
            max-jobs = 2
            cores = 2
            # kvm: lets make-disk-image's qemu use -enable-kvm (the raw leg's
            # udev step above guarantees /dev/kvm perms there; harmless on the
            # ISO legs, which build no VM derivations).
            system-features = nixos-test benchmark big-parallel kvm

      # magic-nix-cache disabled: under heavy load (full NixOS ISO
      # derivation graph) the GitHub Actions Cache quota trips the
      # Twirp ResourceExhausted path at ~5min in, after which the
      # magic-nix-cache daemon announces "Not trying to use it again
      # on this run" — every narinfo fetch thereafter gets HTTP 418,
      # the build aborts, and `nix build` fails. cache.nixos.org is
      # CDN-backed and has no such quota, so we rely on it exclusively.

      - name: Free disk space (aggressive)
        run: |
          # Full NixOS desktop ISO with glibc-locales + GNOME + wine fonts
          # blows past the default 14GB runner disk. iso-desktop failed in
          # run 24625067423 with glibc-locales-2.40-66.drv builder exit 1
          # — classic ENOSPC symptom. Strip everything we don't need.
          # 2026-07-16 (run 29509018080): iso-desktop ENOSPC'd at "42 MB free"
          # mid-mksquashfs — the runner image had accreted enough bloat that the
          # borderline fit tipped over. /opt/hostedtoolcache is the single
          # biggest remaining chunk (~12 GB of Python/Node/Go toolcaches this
          # workflow never touches: its only actions are checkout + the nix
          # installer); JVM + miniconda add ~3 GB more.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/share/chrome /opt/microsoft \
                      /usr/lib/jvm /usr/share/miniconda \
                      /imagegeneration || true
          sudo docker image prune -a -f 2>/dev/null || true
          sudo apt-get remove -y --purge '^dotnet-.*' '^llvm-.*' \
            'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable \
            firefox powershell mono-devel 2>/dev/null || true
          sudo apt-get autoremove -y && sudo apt-get clean
          df -h /

      # ── Warm the store with the Rust-in-Nix closure at FULL parallelism ──
      # WHY THIS STEP EXISTS (the iso-desktop 4h+ hang, run that sat in_progress
      # 4h23m): baking hart.comp (the Smithay/Rust Tier-1 compositor) into the
      # iso-desktop closure folds a 245-crate Rust+LLVM compile into the ISO build.
      # The standalone `nix build .#hart-comp` finishes GREEN in the Nix Build
      # Matrix job because THAT job leaves `cores` at Nix's default (0 = use ALL
      # runner cores). The ISO job, by contrast, pins `cores = 2` / `max-jobs = 2`
      # (added in 8477368 to stop the desktop ISO's parallel C closure from
      # saturating/OOM-ing the 7-core runner). A 2-core throttle is FINE for the
      # cache-served C closure but CATASTROPHIC for a CPU-bound 245-crate Rust+LLVM
      # compile — it stretched the desktop ISO build past 4h and it never settled,
      # so no nightly could complete. hart.comp is NOT in cache.nixos.org (it is a
      # HART-local Rust derivation), so the throttled ISO `nix build` had to compile
      # it from source under the 2-core cap.
      #
      # FIX: realise the heavy Rust derivations (hart-rust-precedent FIRST, then
      # hart-comp) into the LOCAL /nix/store HERE, at `--cores 0` (all cores) and
      # higher `--max-jobs`, BEFORE the throttled ISO step. Once they are in the
      # store, the ISO `nix build` finds them already built and never recompiles
      # them — the 2-core cap then only governs the remaining (lighter, mostly
      # cache-served) closure, exactly as it did before hart.comp existed.
      #
      # Scoped to iso-desktop: hart.comp + hart-rust-precedent are pulled in ONLY
      # by the desktop closure (flake.nix exposes both via the hart-desktop config),
      # so warming them is wasted work on server/edge. The flake's `.#hart-comp` /
      # `.#hart-rust-precedent` package ALIASES are always present and build the
      # package WITHOUT arming the session (they ride lib.mkDefault on every config,
      # outside the `lib.mkIf comp.enable` block), so this warms the store whether
      # or not the steward has re-armed `hart.comp.enable`.
      #
      # DELIBERATELY runs WHILE comp.enable is still deferred (false): it
      # continuously PROVES the full-core in-ISO-runner Rust build settles in
      # normal time, so the steward gets a standing green signal that re-arming
      # `hart.comp.enable = true` is SAFE (the whole point — make the build viable
      # so Tier-1 CAN ship). When they DO re-arm it, the hart-comp closure is
      # already realised in this runner's store and the throttled ISO step reuses
      # it instead of recompiling under the 2-core cap.
      #
      # Never blocks the release: `|| true` — if the precedent/comp build itself
      # regresses, the ISO step (which, with comp.enable currently OFF, does not
      # even pull hart.comp) still runs. The Nix Build Matrix job is the hard gate
      # that red-fails a broken hart-comp; this is purely a store-warming optimiser.
      - name: Warm Rust closure (hart-rust-precedent, hart-comp) at full cores
        # raw-desktop folds the SAME desktop closure (hart-comp included), so it
        # needs the same warm-up to dodge the throttled-cores Rust build hang.
        if: matrix.target == 'iso-desktop' || matrix.target == 'raw-desktop'
        working-directory: nixos
        shell: bash
        run: |
          set -o pipefail
          echo "=== Pre-building the Rust-in-Nix closure at full parallelism ==="
          echo "    (precedent first to isolate toolchain resolution, then hart-comp)"
          # --cores 0 = ALL runner cores per derivation (this is the actual fix —
          # the global cores=2 was strangling the CPU-bound rustc/LLVM compiles).
          # --max-jobs 2 keeps the CONCURRENT-derivation count (and hence peak
          # memory) at the SAME ceiling the ISO step already tolerates; we are not
          # raising memory pressure, only un-throttling the per-build core count.
          # These per-invocation flags OVERRIDE the global cores=2/max-jobs=2 from
          # the installer conf for THIS warm-up only; the ISO step below keeps the
          # 2-core safety cap for its (cache-served) C closure.
          for tgt in hart-rust-precedent hart-comp; do
            echo "--- nix build .#$tgt (warm) ---"
            time nix build ".#$tgt" \
              --no-link --print-out-paths --show-trace \
              --cores 0 --max-jobs 2 \
              --option narinfo-cache-negative-ttl 0 || {
                echo "::warning title=Rust warm-up::nix build .#$tgt did not complete in the warm step — the ISO step will fall back to its own (throttled) build path. See the Nix Build Matrix job for the authoritative hart-comp gate."
                # Do not fail the release on a warm-up miss.
                continue
              }
          done
          echo "=== Rust closure warm-up done ==="

      - name: Build ${{ matrix.target }}
        working-directory: nixos
        shell: bash
        run: |
          set -eo pipefail
          # pipefail + set -e: `tee` no longer hides a failed `nix build`.
          # Retry once: the magic-nix-cache GitHub API is rate-limited
          # and transient 429s shouldn't break a 90-minute OS build.
          for attempt in 1 2; do
            echo "=== nix build attempt $attempt ==="
            if time nix build .#${{ matrix.target }} \
                --no-link --print-out-paths --show-trace \
                --option narinfo-cache-negative-ttl 0 \
                | tee /tmp/build-output.txt; then
              break
            fi
            if [[ $attempt == 2 ]]; then
              echo "ERROR: nix build failed after retry"
              exit 1
            fi
            echo "Retrying after 30s (cache transients)..."
            sleep 30
          done

      - name: Checksum + Torrent
        shell: bash
        run: |
          set -eo pipefail
          echo "=== Build output ==="
          cat /tmp/build-output.txt || { echo "No build output file"; exit 1; }
          BUILD_PATH=$(cat /tmp/build-output.txt | head -1 | tr -d '[:space:]')
          echo "BUILD_PATH: '$BUILD_PATH'"

          if [[ -z "$BUILD_PATH" ]]; then
            echo "ERROR: Nix build produced no output path"
            echo "Check the Build step logs above for errors"
            exit 1
          fi

          echo "=== Listing build path ==="
          ls -la "$BUILD_PATH" || { echo "Path does not exist: $BUILD_PATH"; exit 1; }
          find "$BUILD_PATH" -maxdepth 3 -type f | head -20 || true

          # Find ISO file
          FILE=""
          if [[ -d "$BUILD_PATH/iso" ]]; then
            FILE=$(ls "$BUILD_PATH/iso/"*.iso 2>/dev/null | head -1)
          elif [[ -d "$BUILD_PATH" ]]; then
            FILE=$(find "$BUILD_PATH" -maxdepth 3 -type f \
              \( -name "*.iso" -o -name "*.qcow2" -o -name "*.raw" -o -name "*.img" \) | head -1)
          fi

          echo "FILE: '$FILE'"

          if [[ -z "${FILE:-}" ]] || [[ ! -f "$FILE" ]]; then
            echo "ERROR: No .iso/.qcow2/.raw/.img found in $BUILD_PATH"
            exit 1
          fi

          # ── raw-* targets: name, checksum, compress (2026-07-16) ─────────
          # nixos-generators emits a bare `nixos.img` (same name for every
          # variant), and a ~20 GB raw disk image is unshippable uncompressed.
          # (a) derive the versioned name from the SAME config.hart.version the
          #     ISO branding uses (no second version source);
          # (b) sha256 the UNCOMPRESSED raw under the FINAL name — the flasher
          #     verifies the decompressed device bytes against this;
          # (c) xz -T0 -1 (fast, ~2.5x on a nix store) so the shipped parts are
          #     ISO-sized; the generic split/sha/torrent flow below then treats
          #     the .raw.xz exactly like an ISO (its own .sha256 for reassembly,
          #     .part-NN + reassemble.sh companions the publish guard expects);
          # (d) delete the 20 GB store image before splitting — the runner disk
          #     can't hold closure + raw + xz + parts at once.
          if [[ "${{ matrix.target }}" == raw-* ]]; then
            VARIANT="${{ matrix.target }}"; VARIANT="${VARIANT#raw-}"
            VER=$(cd "${GITHUB_WORKSPACE}/nixos" && nix eval --raw ".#nixosConfigurations.hart-${VARIANT}.config.hart.version")
            RAWNAME="hart-os-${VER}-${VARIANT}-x86_64-linux.raw"
            mkdir -p /tmp/release-artifacts
            RAW_SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
            echo "${RAW_SHA}  ${RAWNAME}" > "/tmp/release-artifacts/${RAWNAME}.sha256"
            echo "raw image: $(du -h "$FILE" | cut -f1), sha256=${RAW_SHA} — compressing"
            xz -T0 -1 -c "$FILE" > "/tmp/${RAWNAME}.xz"
            echo "compressed: $(du -h "/tmp/${RAWNAME}.xz" | cut -f1)"
            sudo nix store delete "$BUILD_PATH" 2>/dev/null \
              || echo "::warning::nix store delete failed — disk stays tighter for the split"
            FILE="/tmp/${RAWNAME}.xz"
            df -h / | tail -1
          fi

          BASENAME=$(basename "$FILE")
          mkdir -p /tmp/release-artifacts

          # GitHub Release assets are capped at 2 GB per file on
          # public repos — iso-desktop is ~2.3 GB (GNOME + wine +
          # fonts) so direct upload returns HTTP 422 "size must be
          # less than 2147483648". Split anything over 1.9 GB into
          # deterministic chunks named .part-aa / .part-ab / …
          # and emit a companion _reassemble.sh so users can
          # `cat *.part-* > foo.iso` or run the script.
          SIZE_BYTES=$(stat -c '%s' "$FILE")
          SPLIT_THRESHOLD=$((1900 * 1024 * 1024))   # 1.9 GiB
          if [[ "$SIZE_BYTES" -gt "$SPLIT_THRESHOLD" ]]; then
            echo "File is $SIZE_BYTES bytes (> 1.9 GiB) — splitting"
            ( cd /tmp/release-artifacts \
              && split -b 1900M -d -a 2 "$FILE" "${BASENAME}.part-" )
            ls -lh /tmp/release-artifacts/"${BASENAME}".part-*
            cat > "/tmp/release-artifacts/${BASENAME}.reassemble.sh" <<REASSEMBLE
          #!/usr/bin/env bash
          # Reassemble ${BASENAME} from GitHub-split 1.9 GiB parts.
          # Usage (after downloading every ${BASENAME}.part-* file):
          #   chmod +x ${BASENAME}.reassemble.sh
          #   ./${BASENAME}.reassemble.sh
          set -euo pipefail
          cat ${BASENAME}.part-* > ${BASENAME}
          sha256sum -c ${BASENAME}.sha256
          REASSEMBLE
            chmod +x "/tmp/release-artifacts/${BASENAME}.reassemble.sh"
            echo "SPLIT=1" >> /tmp/split-status
          else
            # Fits under 2 GB — upload directly.
            cp "$FILE" /tmp/release-artifacts/
          fi

          # Stash the path to the unsplit ISO so the next step (large-
          # asset SSH mirror) can find it after the loop variables fall
          # out of scope.  Only emitted when the ISO actually got split
          # (otherwise the GitHub Release upload covers it directly).
          if [[ "$SIZE_BYTES" -gt "$SPLIT_THRESHOLD" ]]; then
            {
              echo "UNSPLIT_ISO=$FILE"
              echo "UNSPLIT_BASENAME=$BASENAME"
            } >> "$GITHUB_ENV"
          fi

          # SHA-256 checksum (always computed against the uncut ISO). Run sha256sum
          # from the ISO's own dir on its BASENAME so the file is a real
          # "<hash>  <basename>" digest that `sha256sum -c` resolves. (The old
          # `sed "s|.*/||"` was GREEDY -- ".*/" ate the hash too, leaving ONLY the
          # bare filename with no digest, so the .sha256 companion was unusable.)
          ( cd "$(dirname "$FILE")" && sha256sum "$(basename "$FILE")" ) \
            > "/tmp/release-artifacts/${BASENAME}.sha256"

          # Create .torrent with web seed.  workflow_dispatch ships a
          # pinned tag (v1.0.0 etc) so the seed points at that exact
          # release.  push-to-main ships through publish-nightly with
          # a per-sha tag (`nightly-<sha>-<runid>`) marked
          # `--latest=true`, so the seed uses /releases/latest/download/
          # — GitHub redirects that to whatever release currently
          # carries the latest flag, keeping the torrent's HTTP
          # fallback resolvable across rebuilds.
          sudo apt-get install -y -qq mktorrent
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            WEBSEED="https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version }}/${BASENAME}"
          else
            WEBSEED="https://github.com/${{ github.repository }}/releases/latest/download/${BASENAME}"
          fi
          mktorrent -l 22 \
            -c "HART OS — Hevolve Hive Agentic Runtime. https://github.com/${{ github.repository }}" \
            -w "$WEBSEED" \
            -o "/tmp/release-artifacts/${BASENAME}.torrent" \
            "$FILE"

          # Summary
          SIZE=$(du -h "$FILE" | cut -f1)
          SHA=$(cat "/tmp/release-artifacts/${BASENAME}.sha256" | cut -d' ' -f1)
          echo "## ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`$BASENAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`$SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Torrent**: \`${BASENAME}.torrent\` (web-seeded)" >> $GITHUB_STEP_SUMMARY

      - name: Upload ISO + Torrent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: /tmp/release-artifacts/
          retention-days: 30

      # ─── Large-asset bypass for split ISOs ──────────────────────────
      # GitHub Release assets cap at 2 GB.  iso-desktop is ~6.5 GB so it
      # ships to releases as four .part-* files + a reassemble.sh.  That
      # forces every user to run a script before they can boot the ISO.
      # Mirror the UNSPLIT ISO straight to docs.hevolve.ai so the docs
      # page can link a single resolvable URL.
      #
      # Auth piggy-backs on the existing HEVOLVE_DOCS_SSH_* secrets that
      # the docs deploy job already uses (release.yml SSH mirror block).
      # Lands at <DOCS_SSH_PATH>/binaries/<basename>; the docs rsync
      # excludes binaries/ so the next site deploy doesn't nuke it.
      #
      # Skipped silently when:
      #   - ISO didn't get split (UNSPLIT_ISO env not set)
      #   - SSH host/user not configured
      #   - workflow_dispatch (use the release page; users can pin a vX
      #     release without depending on docs server availability)
      - name: Mirror unsplit large ISO to docs.hevolve.ai/binaries/
        if: |
          env.UNSPLIT_ISO != '' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          SSHPASS: ${{ secrets.HEVOLVE_DOCS_SSH_PASS }}
        run: |
          set -euo pipefail
          host='${{ secrets.HEVOLVE_DOCS_SSH_HOST }}'
          user='${{ secrets.HEVOLVE_DOCS_SSH_USER }}'
          path='${{ secrets.HEVOLVE_DOCS_SSH_PATH }}'
          key_set='${{ secrets.HEVOLVE_DOCS_SSH_KEY }}'
          pass_set='${{ secrets.HEVOLVE_DOCS_SSH_PASS }}'
          if [ -z "$host" ] || [ -z "$user" ] || [ -z "$path" ]; then
            echo "::notice title=Large-ISO mirror::Skipped — HEVOLVE_DOCS_SSH_HOST/USER/PATH not configured"
            exit 0
          fi
          if [ -z "$key_set" ] && [ -z "$pass_set" ]; then
            echo "::notice title=Large-ISO mirror::Skipped — neither HEVOLVE_DOCS_SSH_KEY nor _PASS set"
            exit 0
          fi
          PORT='${{ secrets.HEVOLVE_DOCS_SSH_PORT || '22' }}'
          DEST="${path%/}/binaries"
          if [ -n "$key_set" ]; then
            mkdir -p ~/.ssh
            echo "$key_set" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH_BASE="ssh -i ~/.ssh/id_ed25519 -p $PORT -o StrictHostKeyChecking=accept-new"
            $SSH_BASE "$user@$host" "mkdir -p '$DEST'"
            rsync -az --human-readable --stats \
              -e "$SSH_BASE" \
              "$UNSPLIT_ISO" "$user@$host:$DEST/"
          else
            sudo apt-get install -y -qq sshpass
            SSH_BASE="ssh -p $PORT -o StrictHostKeyChecking=accept-new"
            sshpass -e $SSH_BASE "$user@$host" "mkdir -p '$DEST'"
            sshpass -e rsync -az --human-readable --stats \
              -e "$SSH_BASE" \
              "$UNSPLIT_ISO" "$user@$host:$DEST/"
          fi
          echo "::notice title=Large-ISO mirror::Pushed $UNSPLIT_BASENAME to $host:$DEST/"
          echo "  URL: https://docs.hevolve.ai/binaries/$UNSPLIT_BASENAME"

      - name: Attach to GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          files: /tmp/release-artifacts/*
          # DRAFT, never auto-published. build-iso runs PARALLEL to gate-checks
          # (no needs:), so a manual-dispatch ISO must NOT ship untested. It
          # uploads as a draft; a human publishes it only after the gate-checks
          # run for this commit is GREEN (the "test everything that gets built" rule).
          draft: true

      # NOTE: Push-to-main publishing of these ISOs is handled by the
      # `publish-nightly` job below — it uploads the matrix artifacts
      # to a unique-tagged release (`nightly-<sha>-<runid>`) and marks
      # it `--latest=true`.  The previous "Attach to rolling 'nightly'
      # release" step here tried to reuse the literal `nightly` tag,
      # which the repo's release-immutability rule rejects with HTTP
      # 422 ("tag_name was used by an immutable release").  Removed
      # 2026-04-25 — see commit message for the failure log.

  # ═══════════════════════════════════════════════════════════
  # 3a. Build universal installers (fast Go cross-compile)
  # ═══════════════════════════════════════════════════════════
  #
  # Same three binaries that tag-and-sign produces on workflow_dispatch,
  # but also on every push so the docs.hevolve.ai/downloads links
  # `/releases/latest/download/hevolve-install.{exe,macos,linux}`
  # always resolve. Builds in ~1 min — no nix, no matrix.
  build-installers:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Cross-compile hevolve-install {exe,macos,linux}
        working-directory: deploy/installer
        run: |
          set -eo pipefail
          mkdir -p /tmp/installer-artifacts
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o /tmp/installer-artifacts/hevolve-install.exe .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" \
            -o /tmp/installer-artifacts/hevolve-install-macos .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" \
            -o /tmp/installer-artifacts/hevolve-install-linux .
          ls -lh /tmp/installer-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: hevolve-installers
          path: /tmp/installer-artifacts/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # 3b. Publish Nightly Release (draft → upload → publish)
  # ═══════════════════════════════════════════════════════════
  #
  # Repo has release-immutability on: published releases cannot have
  # assets added or mutated. `gh release create` defaults to published,
  # so every "upload to nightly" attempt from the build-iso matrix got
  # HTTP 422. Workaround documented in `gh release create --help`:
  # create as draft (mutable), upload, then publish.
  #
  # We pull this up to a single post-build job so the 3 matrix workers
  # don't race each other creating/publishing the same release.
  #
  # GATED, ALL-OR-NOTHING (the false-green fix):
  #   `if: always()` is DELIBERATELY GONE. It used to publish on PARTIAL matrix
  #   success — when iso-desktop FAILED but iso-server/iso-edge built, it shipped
  #   a 2/3-variant "latest" and reported the run GREEN (the documented false-green
  #   trap: memory hartos_iso_size_ceiling_and_variant_verify_2026-06-26). Now the
  #   needs list (gate-checks + ALL three ISO variants via the build-iso matrix +
  #   the installers) must ALL succeed; a matrix job is `failure` if ANY leg fails
  #   (fail-fast:false only lets the others finish), so one failed variant SKIPS
  #   this publish. /releases/latest then keeps pointing at the last COMPLETE,
  #   TESTED release instead of a broken/untested partial. `gate-checks` adds the
  #   "never publish untested" half — no nightly unless every unit/cargo/nix/
  #   compositor/nixosTest check is green. (build-iso stays PARALLEL to gate-checks
  #   so the heavy VM suite never serialises into the 6h ISO build.)
  #
  # NIGHTLY GATE SPLIT (2026-07-04): the nightly is a PREVIEW. It publishes when all THREE
  # ISO variants + the installers BUILD — build-iso stays all-or-nothing per the matrix, so
  # the 2/3-variant false-green is STILL fixed, and building the full OS closure is itself a
  # strong correctness signal (a broken import / eval / dep fails the build). It NO LONGER
  # hard-blocks on `gate-checks` (unit/cargo/nix/compositor/nixosTests): the heavy VM
  # nixosTest suite carries pre-existing debt that was blocking EVERY nightly. gate-checks
  # STILL runs in parallel (visible red) AND STILL fully gates the SIGNED release —
  # `tag-and-sign` keeps `needs: gate-checks`, so nothing master-key-signed ever ships
  # untested. Nightlies are previews; signed releases stay strict.
  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-iso, build-installers]
    runs-on: ubuntu-latest
    # Uploading ~6.5 GB of split ISO parts is comfortably under 90 min.
    # Without its own budget this job inherits GitHub's 6h hard wall, so a
    # slow build-iso run that pushed the pipeline long could get
    # publish-nightly cancelled mid-upload, shipping a partial (e.g.
    # 3/4-part) release. A dedicated budget fails loud instead, and the
    # verify-before-publish guard below leaves an unpublished DRAFT rather
    # than a broken "latest".
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-artifacts
          pattern: iso-*
          merge-multiple: true

      # Best-effort: the raw-desktop leg is continue-on-error (it must never
      # block the ISO nightly), so its artifact may not exist. This download
      # mirrors that — a miss is a warning, not a failed publish.
      - name: Download raw image artifacts (best-effort)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-artifacts
          pattern: raw-*
          merge-multiple: true

      - name: Download hevolve-install binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-artifacts
          pattern: hevolve-installers
          merge-multiple: true

      - name: Create unique-tagged nightly release, upload, publish as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_ID="${{ github.run_id }}"
          # Globally-unique tag — GitHub's immutable-release feature
          # permanently reserves any tag name used for a published
          # release, so we cannot reuse "nightly" OR "nightly-${SHORT_SHA}"
          # (which would collide on workflow re-run of the same commit).
          # github.run_id is unique per workflow execution, so this tag
          # is guaranteed fresh even under "Re-run all jobs". Docs link
          # to /releases/latest/download/* which GitHub resolves to the
          # release marked `--latest=true` (this one).
          TAG="nightly-${SHORT_SHA}-${RUN_ID}"

          echo "=== Artifacts downloaded ==="
          ls -la /tmp/all-artifacts/ || { echo "No artifacts"; exit 0; }
          FILES=$(find /tmp/all-artifacts -maxdepth 2 -type f | wc -l)
          if [[ "$FILES" -eq 0 ]]; then
            echo "No build artifacts produced by any ISO matrix job — nothing to publish"
            exit 0
          fi

          # Clean up the tag-less draft from the prior refactor (has
          # tag_name=nightly but tag never got created). Idempotent.
          echo "=== Cleaning up any tag-less nightly drafts ==="
          gh api "repos/${REPO}/releases" --jq '.[] | select(.draft==true and .tag_name=="nightly") | .id' \
            | while read -r RID; do
              [[ -n "$RID" ]] && gh api -X DELETE "repos/${REPO}/releases/${RID}" || true
            done

          echo "=== Creating $TAG DRAFT (mutable while draft) ==="
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SHA" \
            --draft \
            --prerelease \
            --title "HART OS nightly ${SHORT_SHA}" \
            --notes "Rolling bleeding-edge ISOs built from \`main\` @ ${SHORT_SHA} on every push. Not signed by the master key — for stable signed releases see the [release archive](https://github.com/${REPO}/releases). Each ISO verifies against its companion \`.sha256\`."

          # Ship the USB flasher with every release — one tool (CLI + GUI) to
          # write the split ISO to a USB without bespoke commands. See
          # scripts/hart_usb_flasher.py.
          cp "${GITHUB_WORKSPACE}/scripts/hart_usb_flasher.py" /tmp/all-artifacts/ 2>/dev/null || true

          echo "=== Uploading artifacts (deterministic order, part-00 first) ==="
          # `find` alone yields filesystem order; `sort` makes the upload
          # sequence reproducible and ships the contiguous .part-00.. first.
          # mapfile + an array loop (NOT `find | while read`) is deliberate:
          # a `while` in a pipeline runs in a subshell, so an `exit 1` there
          # would not abort this script and a partial upload could still get
          # published. The array loop runs in the current shell, so a fatal
          # upload aborts the whole job.
          mapfile -t LOCAL_FILES < <(find /tmp/all-artifacts -maxdepth 2 -type f | sort)

          # 3-attempt retry per file so one transient gh/network hiccup
          # re-tries instead of aborting the whole set-eo-pipefail job.
          # --clobber keeps every (re)upload idempotent.
          upload_with_retry() {
            local f="$1" name attempt
            name="$(basename "$f")"
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --repo "$REPO" --clobber; then
                return 0
              fi
              echo "  !! upload attempt ${attempt}/3 failed for ${name}"
              sleep $((attempt * 5))
            done
            return 1
          }

          for f in "${LOCAL_FILES[@]}"; do
            echo "  -> $(basename "$f")"
            upload_with_retry "$f" || { echo "FATAL: ${f} failed to upload after 3 attempts"; exit 1; }
          done

          # --- VERIFY-BEFORE-PUBLISH guard --------------------------------
          # Never flip the release out of draft on a partial upload. A 6h
          # job-wall cancellation or a dropped chunk would otherwise ship a
          # broken "latest" (e.g. a 3/4-part desktop ISO that cannot be
          # reassembled). We assert (1) every split ISO downloaded here has a
          # contiguous .part-00..part-NN set plus its .reassemble.sh and
          # .sha256 companions, and (2) every local artifact is a published
          # asset on the release. Any gap is re-uploaded once more and
          # re-checked; if still missing we exit 1, leaving the unpublished
          # DRAFT for the keep-newest-3 prune while /releases/latest keeps
          # pointing at the previous COMPLETE release.
          echo "=== Verifying all artifacts present before publish ==="

          remote_asset_names() {
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null
          }

          # (1) Local contiguity of any split ISO actually downloaded.
          # split(1) -d -a 2 emits .part-00 .part-01 ...; a gap means
          # download-artifact dropped a chunk, so fail loud before publish.
          declare -A PART_MAX PART_CNT
          for f in "${LOCAL_FILES[@]}"; do
            name="$(basename "$f")"
            case "$name" in
              *.part-[0-9][0-9])
                base="${name%.part-*}"
                idx=$((10#${name##*.part-}))
                PART_CNT["$base"]=$(( ${PART_CNT["$base"]:-0} + 1 ))
                if [[ -z "${PART_MAX[$base]:-}" || "$idx" -gt "${PART_MAX[$base]}" ]]; then
                  PART_MAX["$base"]=$idx
                fi
                ;;
            esac
          done
          for base in "${!PART_MAX[@]}"; do
            expected=$(( ${PART_MAX[$base]} + 1 ))   # parts are 0-indexed
            if [[ "${PART_CNT[$base]}" -ne "$expected" ]]; then
              echo "FATAL: ${base}: found ${PART_CNT[$base]} parts but highest index ${PART_MAX[$base]} implies ${expected} (a chunk is missing)"
              exit 1
            fi
            for companion in "${base}.reassemble.sh" "${base}.sha256"; do
              if ! printf '%s\n' "${LOCAL_FILES[@]##*/}" | grep -Fxq "$companion"; then
                echo "FATAL: split ISO ${base} is missing companion ${companion} locally"
                exit 1
              fi
            done
            echo "  ok: ${base} has all ${expected} parts + .reassemble.sh + .sha256"
          done

          # (2) Remote presence: every local artifact must be a published
          # asset. Re-upload any stragglers once more, then re-verify.
          REMOTE="$(remote_asset_names || true)"
          MISSING=()
          for f in "${LOCAL_FILES[@]}"; do
            grep -Fxq "$(basename "$f")" <<< "$REMOTE" || MISSING+=("$f")
          done
          if [[ "${#MISSING[@]}" -gt 0 ]]; then
            echo "  ${#MISSING[@]} asset(s) not yet on the release, re-uploading:"
            for f in "${MISSING[@]}"; do
              echo "    -> $(basename "$f")"
              upload_with_retry "$f" || echo "    (re-upload still failing for $(basename "$f"))"
            done
            REMOTE="$(remote_asset_names || true)"
            STILL=()
            for f in "${MISSING[@]}"; do
              grep -Fxq "$(basename "$f")" <<< "$REMOTE" || STILL+=("$(basename "$f")")
            done
            if [[ "${#STILL[@]}" -gt 0 ]]; then
              echo "FATAL: ${#STILL[@]} asset(s) could not be published: ${STILL[*]}"
              echo "Leaving '$TAG' as an unpublished DRAFT; /releases/latest is unchanged."
              exit 1
            fi
          fi
          echo "Verified all ${#LOCAL_FILES[@]} artifact(s) present on '$TAG'."

          echo "=== Publishing as latest (immutable after publish) ==="
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest=true --prerelease=false

          echo "=== Pruning old nightly-* releases (keep newest 3) ==="
          gh api "repos/${REPO}/releases" --paginate \
            --jq '.[] | select(.tag_name | startswith("nightly-")) | {tag:.tag_name, created:.created_at}' \
            | jq -s 'sort_by(.created) | reverse | .[3:] | .[].tag' -r \
            | while read -r OLD_TAG; do
              [[ -n "$OLD_TAG" && "$OLD_TAG" != "$TAG" ]] && {
                echo "  pruning $OLD_TAG"
                gh release delete "$OLD_TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
              }
            done

          echo "=== Done ==="
          # `isLatest` isn't a valid gh CLI --json field — use REST.
          gh api "repos/${REPO}/releases/latest" \
            --jq '{tag:.tag_name, assets:[.assets[].name], published:.published_at}' || true

  # ═══════════════════════════════════════════════════════════
  # 4. Deploy Docs to GitHub Pages
  # ═══════════════════════════════════════════════════════════
  deploy-docs:
    # Docs deploy on any push or manual dispatch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs-material
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Build docs
        run: |
          mkdocs build --strict --site-dir _site
          echo "docs.hevolve.ai" > _site/CNAME

      - name: Run tests + generate reports
        continue-on-error: true
        env:
          HEVOLVE_DB_PATH: ':memory:'
        run: |
          mkdir -p _site/test-reports/junit _site/test-reports/coverage
          python -m pytest \
            tests/unit/ tests/functional/ \
            -v --tb=short \
            --junitxml=_site/test-reports/junit/results.xml \
            --cov=integrations --cov=security --cov=core \
            --cov=hart_intelligence_entry --cov=create_recipe --cov=reuse_recipe \
            --cov=lifecycle_hooks --cov=helper --cov=helper_ledger \
            --cov-report=html:_site/test-reports/coverage \
            --cov-report=term-missing || true

      - name: Generate test reports index
        run: |
          cat > _site/test-reports/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>HART OS Test Reports</title>
          <style>
            body{font-family:system-ui,sans-serif;max-width:800px;margin:60px auto;padding:0 20px;color:#333}
            h1{color:#512da8;border-bottom:2px solid #512da8;padding-bottom:10px}
            a{color:#512da8;text-decoration:none}a:hover{text-decoration:underline}
            .card{border:1px solid #ddd;border-radius:8px;padding:20px;margin:16px 0}
            .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}.card h2{margin-top:0}
          </style></head>
          <body>
            <a href="../">Back to Docs</a>
            <h1>HART OS Test Reports</h1>
            <div class="card"><h2><a href="coverage/index.html">Code Coverage Report</a></h2>
            <p>Interactive line-by-line coverage browser.</p></div>
            <div class="card"><h2><a href="junit/results.xml">JUnit XML Results</a></h2>
            <p>Machine-readable test results.</p></div>
          </body></html>
          INDEXEOF

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Restore custom domain
        run: |
          gh api repos/${{ github.repository }}/pages \
            --method PUT \
            --field cname="docs.hevolve.ai" \
            --field https_enforced=true || true
        env:
          GH_TOKEN: ${{ github.token }}

      # ─────────────────────────────────────────────────────────────
      # Optional SSH mirror — hevolve.ai/docs.hevolve.ai on own server
      # ─────────────────────────────────────────────────────────────
      # Accepts EITHER key-based OR password-based auth, whichever is
      # configured.  Required secrets:
      #   HEVOLVE_DOCS_SSH_HOST   server hostname
      #   HEVOLVE_DOCS_SSH_USER   ssh user
      #   HEVOLVE_DOCS_SSH_PATH   absolute web-root path on server
      #
      # Pick ONE of these auth methods:
      #   HEVOLVE_DOCS_SSH_KEY    openssh-format PRIVATE key (ed25519
      #                           recommended).  The matching public
      #                           key must be in ~/.ssh/authorized_keys
      #                           on the server.
      #   HEVOLVE_DOCS_SSH_PASS   ssh password.  sshpass is installed
      #                           at runtime.  Requires sshd config
      #                           PasswordAuthentication yes.
      #
      # Optional:
      #   HEVOLVE_DOCS_SSH_PORT   ssh port, defaults to 22
      #   HEVOLVE_DOCS_KNOWN_HOSTS  seed known_hosts entries
      #
      # If both KEY and PASS are set, KEY wins (more secure).
      - name: Check SSH mirror configuration
        id: ssh_cfg
        run: |
          host='${{ secrets.HEVOLVE_DOCS_SSH_HOST }}'
          user='${{ secrets.HEVOLVE_DOCS_SSH_USER }}'
          path='${{ secrets.HEVOLVE_DOCS_SSH_PATH }}'
          key_set='${{ secrets.HEVOLVE_DOCS_SSH_KEY }}'
          pass_set='${{ secrets.HEVOLVE_DOCS_SSH_PASS }}'
          auth=''
          if [ -n "$key_set" ]; then
            auth='key'
          elif [ -n "$pass_set" ]; then
            auth='pass'
          fi
          if [ -n "$host" ] && [ -n "$user" ] && [ -n "$path" ] && [ -n "$auth" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "auth=$auth" >> "$GITHUB_OUTPUT"
            echo "::notice title=SSH mirror::Deploying _site/ to ${{ secrets.HEVOLVE_DOCS_SSH_USER }}@${{ secrets.HEVOLVE_DOCS_SSH_HOST }}:${{ secrets.HEVOLVE_DOCS_SSH_PATH }} (auth=$auth)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice title=SSH mirror::Skipped — need HEVOLVE_DOCS_SSH_HOST + USER + PATH + (KEY or PASS) secrets to enable."
          fi

      - name: Install SSH key
        if: steps.ssh_cfg.outputs.enabled == 'true' && steps.ssh_cfg.outputs.auth == 'key'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HEVOLVE_DOCS_SSH_KEY }}
          known_hosts: ${{ secrets.HEVOLVE_DOCS_KNOWN_HOSTS || '' }}
          if_key_exists: replace
          config: |
            Host hevolve_docs_target
              HostName ${{ secrets.HEVOLVE_DOCS_SSH_HOST }}
              User ${{ secrets.HEVOLVE_DOCS_SSH_USER }}
              Port ${{ secrets.HEVOLVE_DOCS_SSH_PORT || '22' }}
              StrictHostKeyChecking accept-new

      - name: Install sshpass (password auth)
        if: steps.ssh_cfg.outputs.enabled == 'true' && steps.ssh_cfg.outputs.auth == 'pass'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.HEVOLVE_DOCS_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.HEVOLVE_DOCS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          fi
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync _site via key
        if: steps.ssh_cfg.outputs.enabled == 'true' && steps.ssh_cfg.outputs.auth == 'key'
        run: |
          set -euo pipefail
          # Trailing slash on _site/ -> rsync copies contents, not the
          # _site directory itself.  --exclude=binaries/ leaves the
          # large-asset mirror dir alone (the build-iso step rsyncs the
          # 6.5 GB unsplit desktop ISO there; without this exclude,
          # --delete would nuke it on every docs push).
          rsync -az --delete --exclude='binaries/' --human-readable --stats \
            _site/ \
            hevolve_docs_target:'${{ secrets.HEVOLVE_DOCS_SSH_PATH }}'
          echo "::notice title=SSH mirror::Pushed via key to ${{ secrets.HEVOLVE_DOCS_SSH_HOST }}:${{ secrets.HEVOLVE_DOCS_SSH_PATH }}"

      - name: Rsync _site via password
        if: steps.ssh_cfg.outputs.enabled == 'true' && steps.ssh_cfg.outputs.auth == 'pass'
        env:
          SSHPASS: ${{ secrets.HEVOLVE_DOCS_SSH_PASS }}
        run: |
          set -euo pipefail
          PORT='${{ secrets.HEVOLVE_DOCS_SSH_PORT || '22' }}'
          # See the key-auth variant above for the --exclude rationale.
          # sshpass reads the password from the SSHPASS env var (-e),
          # so it never hits argv or the process listing.
          # -o StrictHostKeyChecking=accept-new trusts first-seen keys
          # (same posture as the key path's ssh-config above).
          sshpass -e rsync -az --delete --exclude='binaries/' --human-readable --stats \
            -e "ssh -p $PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            _site/ \
            '${{ secrets.HEVOLVE_DOCS_SSH_USER }}@${{ secrets.HEVOLVE_DOCS_SSH_HOST }}:${{ secrets.HEVOLVE_DOCS_SSH_PATH }}'
          echo "::notice title=SSH mirror::Pushed via password to ${{ secrets.HEVOLVE_DOCS_SSH_HOST }}:${{ secrets.HEVOLVE_DOCS_SSH_PATH }}"
