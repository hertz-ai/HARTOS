name: Shell UI WebKit Safety

# Fast functional gate for the HART OS glass-shell JavaScript + the floating
# voice orb. The e2e-os-test workflow boots the ISO but only checks that
# services are active and the WebKit typelib is present — it never EXECUTES the
# shell's JavaScript, so a JS crash (e.g. the AbortSignal.timeout TypeError that
# the NixOS 24.11 WebKitGTK throws, which kills the whole inline <script>) is
# invisible to it. This job runs the orb renderer in an old-WebKitGTK-simulated
# environment in seconds, so that class of bug is caught in CI, not on hardware.
on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/agent_engine/liquid_ui_service.py'
      - 'integrations/agent_engine/static/**'
      - 'tests/test_orb_webkit_safety.py'
      - 'tests/unit/test_shell_*.py'
      - 'tests/unit/test_shell_*.mjs'
      - 'tests/js/orb_webkit_harness.js'
      - '.github/workflows/shell-ui-test.yml'
  pull_request:
    paths:
      - 'integrations/agent_engine/liquid_ui_service.py'
      - 'integrations/agent_engine/static/**'
      - 'tests/unit/test_shell_*.py'

concurrency:
  group: shell-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-ui-webkit:
    name: Shell JS + orb survive old WebKitGTK
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test deps
        # `requests` is REQUIRED, not optional: tests/conftest.py's autouse
        # reset_state_machine fixture imports lifecycle_hooks -> core.session_cache
        # -> core.http_pool -> requests. Without it the whole job died at first-test
        # setup with `ModuleNotFoundError: No module named 'requests'` (#129) — a
        # chronically-red gate that gets ignored. The orb/shell RENDER tests still
        # self-skip when the heavy shell module can't import (this stays a fast,
        # deps-light gate); requests just lets the fixture chain + the node/source
        # guards run green.
        #
        # `flask` joins it for the SAME reason, one incident later (2026-08-03):
        # the session-state round-trip tests build the shell's Flask app, and
        # flask is imported LAZILY inside LiquidUIService._create_flask_app —
        # so the module imports fine and the tests' own skip-guard (which wraps
        # only the import) does not fire. They died at CALL time with
        # `ModuleNotFoundError: No module named 'flask'` instead of skipping,
        # and this gate had been red on every run since at least 07-31.
        # Installing it makes those tests RUN, which is better than teaching
        # them to skip: they are the behavioural half that the source-shape
        # guard beside them is explicitly not allowed to replace.
        run: python -m pip install --upgrade pip pytest requests flask

      # The node + source tests always run (no heavy deps). The render tests
      # self-skip if the shell module can't import in a minimal runner.
      - name: Orb / shell WebKitGTK functional tests
        run: python -m pytest tests/test_orb_webkit_safety.py -v

      # Phase A-D shell features (drag-drop desktop, virtual desktops, themes +
      # wallpaper gallery, marketplace, polish). JS-shape + asset guards run on
      # the static files; the render/round-trip tests self-skip without heavy deps.
      - name: Shell feature tests (desktop / personalize / marketplace / polish)
        run: >-
          python -m pytest -v
          tests/unit/test_shell_desktop_icons.py
          tests/unit/test_shell_icon_customize.py
          tests/unit/test_shell_personalize.py
          tests/unit/test_shell_marketplace.py
          tests/unit/test_shell_polish.py
