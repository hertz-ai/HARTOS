name: Nix Build Matrix

# Builds key HART OS image targets in parallel.
# Each target takes 30-60 min (with cache).
# Runs on PRs to main or manual dispatch.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated build targets (or "all")'
        default: 'iso-server,iso-desktop,iso-edge'
        required: false
  push:
    branches: [main]
    paths:
      - 'nixos/**'
      # Rust-in-Nix crate sources: a compositor/ or claw_native/rust/ edit (not just
      # a .nix edit) must re-trigger the hart-comp / hart-rust-precedent compile.
      - 'compositor/**'
      - 'claw_native/rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'nixos/**'
      - 'compositor/**'
      - 'claw_native/rust/**'

concurrency:
  # Push/PR runs share one group per ref and still cancel each other: on a busy
  # branch only the newest commit is worth building.
  #
  # A workflow_dispatch gets its OWN group (keyed by run id) so it is never
  # cancelled by a later push. Both used to resolve to `nix-build-refs/heads/main`,
  # so an on-demand build was killed the moment anyone pushed: run 30283762645, a
  # raw-desktop build, died at 16:58 to a push that landed 44 minutes after it
  # started. With several sessions pushing to main, a build that takes ~54 minutes
  # could effectively never finish, and the symptom looked like a flaky build
  # rather than a cancellation.
  group: nix-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  # ─── Fast Gate: evaluate first ─────────────────────────────
  evaluate:
    name: Flake Evaluation Gate
    runs-on: ubuntu-latest
    # 25 (was 10): the eval outgrew the old budget on 2026-07-29 — attempt 3 of
    # run 30435280105 ran a MEASURED 15 minutes before enforcement cancelled it,
    # where the gate took ~2.5 min the day before. The two earlier "runner has
    # received a shutdown signal" deaths at 2-4 min were slow runners dying
    # inside the same overrun, not infra flake. The ~6x eval-time growth landed
    # with the installer/Calamares/dev-tools commits and is tracked as its own
    # regression (a gate this slow taxes every push) — this bump un-bricks the
    # gate while that hunt happens, it does not excuse it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            # See the build job for the rationale — keep cache.nixos.org as the only
            # substituter and fall back to local realisation on a genuine miss.
            fallback = true
      # NOTE: magic-nix-cache-action intentionally REMOVED — see the build job.

      - name: Evaluate all outputs (no build)
        working-directory: nixos
        run: nix flake check --no-build

      # The gate died twice on ab6825cc with SIGTERM ("runner has received a
      # shutdown signal") after ~80s of silence, at a DIFFERENT eval position
      # each time — the shape of a single eval process crossing the 16 GB runner
      # ceiling, not of a broken expression (every output that evaluated passed,
      # both runs). Same instrument-don't-guess step that cornered the repart
      # ENOSPC and the governor RLIMIT_AS bug: capture what the machine looked
      # like at death so the next failure names its resource. dmesg is the only
      # place an OOM kill leaves a trace.
      - name: Why did the gate die (resources at failure time)
        # failure() is FALSE when the previous step was CANCELLED, and both
        # runner shutdown and concurrency supersession CANCEL rather than fail —
        # so this fired for the ENOSPC/OOM case it was written for and NEVER for
        # the dominant one (38 of 65 runs this week ended cancelled). On a
        # concurrency-cancelled run the runner is still alive and can still
        # capture state, which is exactly when we most want it.
        if: failure() || cancelled()
        run: |
          echo "── memory ──"; free -m || true
          echo "── disk ──"; df -h / /tmp 2>/dev/null || true
          echo "── OOM / kills (dmesg — KERNEL oom only) ──"
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -15; true
          # Round-2 addition: the kernel dmesg came back EMPTY while the job was
          # SIGTERMed at ~3min with 15G free post-mortem and no timeout (3m37s /
          # 2m37s vs the 10min cap). The remaining suspect is systemd-oomd —
          # Ubuntu 24's USERSPACE killer: acts on memory-pressure stalls (PSI),
          # not exhaustion, and logs to the JOURNAL, which round 1 never read.
          echo "── systemd-oomd (journal — the userspace killer dmesg misses) ──"
          sudo journalctl --no-pager -q 2>/dev/null | grep -iE "oomd|out of memory|killed" | tail -20; true
          echo "── oomd status + pressure config ──"
          systemctl is-active systemd-oomd 2>/dev/null; true
          oomctl 2>/dev/null | head -30; true
          echo "── job cgroup pressure ──"
          cat /proc/pressure/memory 2>/dev/null; true
          echo "── biggest processes at death ──"
          ps aux --sort=-%mem 2>/dev/null | head -8; true

  # ─── Resolve which targets to build ────────────────────────
  # The `targets` dispatch input existed but was NEVER READ: the matrix below was a
  # hardcoded list, so choosing targets by hand did nothing and the only way to
  # build something outside that list was to edit this file. This job makes the
  # input real. A push still builds exactly the same default set, so push behaviour
  # is unchanged.
  targets:
    name: Resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # The default set: what a push to nixos/** has always built.
          DEFAULT='hart-rust-precedent,hart-comp,iso-server,iso-desktop,iso-edge,qcow2-server,docker-server'
          # Everything the flake can build on demand, including the raw INSTALLED
          # images, which are deliberately NOT in the default set: they are only
          # needed when someone is actually shipping an installed system.
          ALL="$DEFAULT,raw-desktop,raw-server,raw-edge"
          REQ='${{ inputs.targets }}'
          if [ '${{ github.event_name }}' != 'workflow_dispatch' ] || [ -z "$REQ" ]; then
            REQ="$DEFAULT"
          elif [ "$REQ" = 'all' ]; then
            REQ="$ALL"
          fi
          LIST=$(printf '%s' "$REQ" | tr -d '[:space:]' | jq -Rc 'split(",") | map(select(length > 0))')

          # Reject unknown targets HERE, in a job that costs seconds, instead of
          # letting them reach the matrix. The input is comma-separated BARE NAMES
          # and `jq -Rc split(",")` array-ifies them, so passing a JSON array by
          # mistake (targets='["raw-desktop"]') yields a one-element list whose
          # element is the literal string `["raw-desktop"]`. That is not an error to
          # any later step: it produces a job cheerfully named `Build [raw-desktop]`
          # in which every `startsWith(matrix.target, 'raw-')` guard is FALSE, so the
          # disk purge and the closure budget silently skip and `nix build` fails on
          # a nonexistent attribute ~90 seconds later (run 30333633950). A wrong
          # dispatch should say so immediately and say what the right one looks like.
          INVALID=$(printf '%s' "$LIST" | jq -r --arg all "$ALL" \
            '($all | split(",")) as $ok | map(select(IN($ok[]) | not)) | join(", ")')
          if [ -n "$INVALID" ]; then
            echo "::error::Unknown build target(s): $INVALID"
            echo "Valid targets: $ALL  (or 'all')"
            echo "Input is COMMA-SEPARATED BARE NAMES, e.g.  targets=raw-desktop"
            echo "                                  NOT JSON, e.g. '[\"raw-desktop\"]'"
            exit 1
          fi

          echo "resolved: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  # ─── Build Matrix ──────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    # `targets` as well as `evaluate`: the matrix is now computed, so the build
    # cannot start before the list exists.
    needs: [evaluate, targets]
    runs-on: ubuntu-latest
    # Bumped 90 -> 150: with the throttling magic-nix-cache removed (see the Install
    # Nix step), HART's own derivations build from source each run instead of being
    # served cross-run, so the heaviest target (iso-desktop, ~70 min before) has more
    # cold-build headroom. cache.nixos.org still serves the upstream closure.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Resolved by the `targets` job above. On a push this is the same default set
      # as before (hart-rust-precedent, hart-comp, the three ISOs, qcow2-server,
      # docker-server); a workflow_dispatch can name any flake target, including the
      # raw INSTALLED images which are too expensive to build on every push.
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # raw-* only: put the ENTIRE nix store on the runner's second data disk (/mnt)
      # when there IS one, BEFORE the Nix installer runs.
      #
      # SELF-VERIFYING ON PURPOSE. This step was added on the assumption that every
      # Actions runner has a separate ~65 GB /mnt data disk (release.yml carries the
      # same step). On the image backing THIS workflow it is a lie: run 30308494154's
      # failure diagnostics printed `/` and `/mnt` as the SAME `/dev/root` (145G), so
      # the bind moved the store from one directory to another on one filesystem and
      # bought exactly zero bytes -- while reading, in the log, like a fix had been
      # applied. A no-op that looks like a mitigation is worse than no step at all,
      # because it makes the next person rule out the very thing that is still wrong.
      # So: compare the backing devices and only bind when they actually differ, and
      # say plainly which branch was taken.
      - name: Move /nix to the /mnt data disk (raw only, if a real second disk exists)
        if: startsWith(matrix.target, 'raw-')
        run: |
          root_dev=$(findmnt -no SOURCE --target / || echo unknown)
          mnt_dev=$(findmnt -no SOURCE --target /mnt || echo none)
          echo "root=$root_dev  /mnt=$mnt_dev"
          if [ "$mnt_dev" != "none" ] && [ "$mnt_dev" != "$root_dev" ]; then
            echo "Separate data disk found -> moving /nix onto it."
            sudo mkdir -p /mnt/nix /nix
            sudo mount --bind /mnt/nix /nix
          else
            echo "NO separate data disk on this runner image -- /mnt shares $root_dev."
            echo "Leaving /nix on the root disk; the budget comes from the purge below."
          fi
          df -h / /mnt 2>/dev/null || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            # `fallback = true`: on a genuine substituter MISS (path not in
            # cache.nixos.org), build from source instead of erroring.
            fallback = true

      # magic-nix-cache-action was REMOVED here (it used to follow). In THIS org it
      # is unauthenticated (logs "Cannot find netrc credentials for api.flakehub.com")
      # and the GitHub Actions Cache THROTTLES its local narinfo proxy mid-build —
      #   error: unable to download 'http://127.0.0.1:.../….narinfo': HTTP error 418
      #          GitHub Actions Cache throttled Magic Nix Cache.
      # A 418 from a configured substituter is a HARD transport error that aborts the
      # build REGARDLESS of `fallback` (fallback only covers a clean miss, not a 418),
      # so the throttle was randomly red-failing otherwise-fine jobs (hart-rust-
      # precedent + docker-server died on it while hart-comp passed, purely by timing).
      # Dropping the action leaves cache.nixos.org (configured by nix-installer-action)
      # as the sole substituter + local source builds — slower on cold paths but
      # RELIABLE, no throttling proxy to abort the Rust compiles. Re-add only once the
      # org has working FlakeHub/cache auth.

      # The baseline purge (dotnet + android SDK + ghc) frees ~15 GB: 57G used -> 42G,
      # measured in run 30312462459. That is enough for every ISO leg and NOT enough
      # for a raw image, which needs the closure resident TWICE at peak -- see the
      # raw-only block below for the arithmetic.
      - name: Free disk space
        run: |
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /
          echo "freed $(( $(df --output=avail -BG / | tail -1 | tr -dc '0-9') - before )) GB (baseline purge)"

      # raw-* only: strip the rest of the preinstalled toolchains.
      #
      # WHY, with the numbers, because six builds died guessing at this. The desktop
      # closure is ~37 GiB (repart's own minimize pass measured 9627552 4k blocks).
      # systemd-repart gets NO loop device inside the Nix sandbox, so it cannot mkfs
      # straight into the image: it builds the ext4 in a TEMP FILE, then copies that
      # file into the .raw at the partition offset. Both exist at once, so the peak is
      # roughly 2x the closure (~78 GB) on top of the ~42 GB the closure occupies in
      # /nix/store. Run 30312462459 reached repart with 61 GB free, wrote the 37 GB
      # temp filesystem, started the copy and hit ENOSPC ~24 GB in -- which is exactly
      # the unexplained 2-minute gap between "Writing superblocks ... done" (00:42:22)
      # and the failure (00:44:31), and exactly why nothing was printed: the copy loop
      # dies without reaching any of repart's own log statements.
      #
      # This purge frees ~25 GB more (hostedtoolcache alone is ~10 GB), taking the
      # free space at repart time from ~61 GB to ~86 GB against a ~78 GB worst-case
      # need. Scoped to raw-* so the green ISO legs keep the exact environment they
      # are proven on; hostedtoolcache in particular holds the Python/Node the ISO
      # jobs' actions may reach for. Nothing after this step needs it: the remaining
      # steps are bash + nix, and the post-job hooks use the runner's own bundled
      # node under /home/runner/runners/*/externals.
      - name: Free MORE disk space (raw only)
        if: startsWith(matrix.target, 'raw-')
        run: |
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/local/share/boost \
            /opt/az \
            /usr/local/lib/node_modules || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
          echo "freed $(( $(df --output=avail -BG / | tail -1 | tr -dc '0-9') - before )) GB (raw purge)"

      # raw-* only: build the system closure on its own FIRST and print its size.
      # The image build is closure-bound and, per the note above, needs ~2x the
      # closure free at repart time -- so the closure size IS the disk budget, and
      # it has been the one number nobody had while six builds failed. Splitting it
      # out costs no extra time (the image build needs the same closure and picks it
      # straight out of the store) and it reports even when the image step later
      # fails, which is the point. The per-path listing turns "the image is too big"
      # into a named list of what to shrink.
      - name: Closure budget (raw only)
        if: startsWith(matrix.target, 'raw-')
        working-directory: nixos
        run: |
          set -o pipefail
          # -raw, NOT the bare variant: nixosConfigurations.hart-desktop carries
          # hartImageKind = "iso" and is a DIFFERENT closure. hart-desktop-raw is
          # built from the same mkRepartSystem the image itself is made from.
          variant="${{ matrix.target }}"
          cfg="hart-${variant#raw-}-raw"
          # Only the variants on the repart path have a -raw config; raw-server and
          # raw-edge still go through nixos-generators, where this budget does not
          # apply. Skip rather than red-fail their dispatch. hasAttr tests the KEY, so
          # it does not force the config and costs a flake-outputs eval, not a system
          # eval — checking by building the attr would evaluate the whole system twice.
          if [ "$(nix eval --json ".#nixosConfigurations" \
                    --apply "c: builtins.hasAttr \"$cfg\" c")" != "true" ]; then
            echo "No nixosConfigurations.$cfg -- ${{ matrix.target }} is not on the"
            echo "repart path, so the 2x-closure disk budget does not apply. Skipping."
            exit 0
          fi
          top=$(nix build ".#nixosConfigurations.$cfg.config.system.build.toplevel" \
                  -L --no-link --print-out-paths)
          bytes=$(nix path-info -S "$top" | awk '{print $2}')
          echo ""
          echo "── closure budget ─────────────────────────────────────────"
          echo "toplevel : $top"
          echo "closure  : $(numfmt --to=iec-i --suffix=B "$bytes")  ($bytes bytes)"
          echo "repart peak needs ~2x that free, plus the store copy."
          echo "free now : $(df -h --output=avail / | tail -1 | tr -d ' ')"
          echo ""
          echo "── 25 largest paths in the closure (SELF size) ────────────"
          # -s (self/NAR size), NOT -S (closure size). With -S every path near the
          # root reports ~the whole system -- the first fifteen lines came back as
          # "21GiB etc", "21GiB dbus-1", "21GiB system-units", which is true and
          # completely useless for finding what to cut. Self size names the actual
          # heavy packages.
          #
          # awk 'NR<=25', NOT `head -25`: `head` exits after 25 lines, `sort` gets
          # EPIPE, and under the `set -o pipefail` at the top of this step the whole
          # pipeline reports failure -- which failed this step and SKIPPED the image
          # build in run 30334471869 after the budget had already printed correctly.
          # awk reads its input to the end, so there is no early close to trip on.
          nix path-info -rs "$top" | sort -k2 -n -r \
            | awk 'NR<=25 { printf "%9.2f MiB  %s\n", $2/1048576, $1 }'

      - name: Build ${{ matrix.target }}
        working-directory: nixos
        run: |
          # pipefail is MANDATORY: `nix build … | tee` otherwise reports tee's exit
          # (0) and the job goes green even when nix FAILED — this masked a real
          # hart-comp buildInputs eval error ("'libseat' renamed to 'seatd'") as a
          # passing build. With pipefail a nix failure red-fails the job (applies to
          # every matrix target, not just the Rust crates).
          set -o pipefail
          echo "Building: nix build .#${{ matrix.target }}"
          echo ""
          # -L / --print-build-logs: stream the FULL builder output instead of the
          # 25-line tail nix prints on failure. raw-desktop failed after 54 minutes
          # (2026-07-27, run 30263310599) having built the whole closure, the UKI and
          # both filesystems, and the only thing nix showed was 25 lines of trailing
          # mke2fs progress -- the actual error had scrolled out of that window. A
          # build worth 54 minutes deserves a readable failure the first time.
          time nix build .#${{ matrix.target }} -L --no-link --print-out-paths | tee /tmp/build-output.txt
          echo ""
          echo "Build successful!"

      # Five raw-desktop builds died silently after ~50 minutes, each time straight
      # after the filesystem was written, with the builder printing NOTHING even
      # under -L. Silence is not evidence, and guessing a cause per 50-minute
      # iteration is the expensive way to debug. This captures the machine state at
      # the moment of failure so the next run says which resource ran out rather
      # than leaving it to inference: disk (the ENOSPC theory), memory (an OOM kill
      # leaves no message in the build log, only in dmesg), or neither.
      - name: Why did it fail (resources at failure time)
        # failure() is FALSE when the previous step was CANCELLED, and both
        # runner shutdown and concurrency supersession CANCEL rather than fail —
        # so this fired for the ENOSPC/OOM case it was written for and NEVER for
        # the dominant one (38 of 65 runs this week ended cancelled). On a
        # concurrency-cancelled run the runner is still alive and can still
        # capture state, which is exactly when we most want it.
        if: failure() || cancelled()
        run: |
          echo "── disk ──"
          df -h / /mnt /tmp 2>/dev/null || true
          echo ""
          echo "── largest consumers ──"
          sudo du -xh --max-depth=1 /nix 2>/dev/null | sort -rh | head -5 || true
          echo ""
          echo "── memory ──"
          free -m || true
          echo ""
          echo "── OOM kills / IO errors (dmesg) ──"
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process|No space|I/O error" | tail -20 || echo "  none found"

      - name: Compute checksum
        run: |
          BUILD_PATH=$(cat /tmp/build-output.txt | head -1)
          echo "Build path: $BUILD_PATH"
          echo ""

          # Find the primary output file
          if [[ -d "$BUILD_PATH/iso" ]]; then
            FILE=$(ls "$BUILD_PATH/iso/"*.iso 2>/dev/null | head -1)
          elif [[ -d "$BUILD_PATH" ]]; then
            FILE=$(find "$BUILD_PATH" -maxdepth 2 -type f \
              \( -name "*.iso" -o -name "*.qcow2" -o -name "*.raw" -o -name "*.tar.gz" \) \
              | head -1)
          fi

          if [[ -n "${FILE:-}" ]] && [[ -f "$FILE" ]]; then
            SIZE=$(du -h "$FILE" | cut -f1)
            SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
            echo "File: $(basename $FILE)"
            echo "Size: $SIZE"
            echo "SHA256: $SHA"
            echo ""
            echo "## Build: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
            echo "- **File**: \`$(basename $FILE)\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **SHA256**: \`$SHA\`" >> $GITHUB_STEP_SUMMARY

            # Create .torrent with web seed pointing to GitHub Release
            echo ""
            echo "Creating .torrent..."
            sudo apt-get install -y -qq mktorrent 2>/dev/null || true
            if command -v mktorrent &>/dev/null; then
              BASENAME=$(basename "$FILE")
              VERSION="${GITHUB_REF_NAME#v}"
              WEBSEED="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${BASENAME}"
              # Write to /tmp (writable) — "$FILE" lives in /nix/store, which is
              # read-only, so `-o "${FILE}.torrent"` failed with "Permission
              # denied" and red-failed every iso/qcow2 job even though the image
              # itself built fine (#69).
              mktorrent -l 22 \
                -c "HART OS — Hevolve Hive Agentic Runtime" \
                -w "$WEBSEED" \
                -o "/tmp/${BASENAME}.torrent" \
                "$FILE"
              echo "- **Torrent**: \`${BASENAME}.torrent\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Web Seed**: \`$WEBSEED\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No output file found (may be a derivation-only build)"
          fi

      - name: Upload artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hart-os-${{ matrix.target }}
          path: |
            /tmp/build-output.txt
            /tmp/*.torrent
          retention-days: 7

  # ─── Summary ───────────────────────────────────────────────
  summary:
    name: Build Summary
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "## HART OS Build Matrix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All builds completed. Check individual job logs for details." >> $GITHUB_STEP_SUMMARY
