name: Nix Build Matrix

# Builds key HART OS image targets in parallel.
# Each target takes 30-60 min (with cache).
# Runs on PRs to main or manual dispatch.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated build targets (or "all")'
        default: 'iso-server,iso-desktop,iso-edge'
        required: false
  push:
    branches: [main]
    paths:
      - 'nixos/**'
      # Rust-in-Nix crate sources: a compositor/ or claw_native/rust/ edit (not just
      # a .nix edit) must re-trigger the hart-comp / hart-rust-precedent compile.
      - 'compositor/**'
      - 'claw_native/rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'nixos/**'
      - 'compositor/**'
      - 'claw_native/rust/**'

concurrency:
  # Push/PR runs share one group per ref and still cancel each other: on a busy
  # branch only the newest commit is worth building.
  #
  # A workflow_dispatch gets its OWN group (keyed by run id) so it is never
  # cancelled by a later push. Both used to resolve to `nix-build-refs/heads/main`,
  # so an on-demand build was killed the moment anyone pushed: run 30283762645, a
  # raw-desktop build, died at 16:58 to a push that landed 44 minutes after it
  # started. With several sessions pushing to main, a build that takes ~54 minutes
  # could effectively never finish, and the symptom looked like a flaky build
  # rather than a cancellation.
  group: nix-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  # ─── Fast Gate: evaluate first ─────────────────────────────
  evaluate:
    name: Flake Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            # See the build job for the rationale — keep cache.nixos.org as the only
            # substituter and fall back to local realisation on a genuine miss.
            fallback = true
      # NOTE: magic-nix-cache-action intentionally REMOVED — see the build job.

      - name: Evaluate all outputs (no build)
        working-directory: nixos
        run: nix flake check --no-build

  # ─── Resolve which targets to build ────────────────────────
  # The `targets` dispatch input existed but was NEVER READ: the matrix below was a
  # hardcoded list, so choosing targets by hand did nothing and the only way to
  # build something outside that list was to edit this file. This job makes the
  # input real. A push still builds exactly the same default set, so push behaviour
  # is unchanged.
  targets:
    name: Resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # The default set: what a push to nixos/** has always built.
          DEFAULT='hart-rust-precedent,hart-comp,iso-server,iso-desktop,iso-edge,qcow2-server,docker-server'
          # Everything the flake can build on demand, including the raw INSTALLED
          # images, which are deliberately NOT in the default set: they are only
          # needed when someone is actually shipping an installed system.
          ALL="$DEFAULT,raw-desktop,raw-server,raw-edge"
          REQ='${{ inputs.targets }}'
          if [ '${{ github.event_name }}' != 'workflow_dispatch' ] || [ -z "$REQ" ]; then
            REQ="$DEFAULT"
          elif [ "$REQ" = 'all' ]; then
            REQ="$ALL"
          fi
          LIST=$(printf '%s' "$REQ" | tr -d '[:space:]' | jq -Rc 'split(",") | map(select(length > 0))')
          echo "resolved: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  # ─── Build Matrix ──────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    # `targets` as well as `evaluate`: the matrix is now computed, so the build
    # cannot start before the list exists.
    needs: [evaluate, targets]
    runs-on: ubuntu-latest
    # Bumped 90 -> 150: with the throttling magic-nix-cache removed (see the Install
    # Nix step), HART's own derivations build from source each run instead of being
    # served cross-run, so the heaviest target (iso-desktop, ~70 min before) has more
    # cold-build headroom. cache.nixos.org still serves the upstream closure.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Resolved by the `targets` job above. On a push this is the same default set
      # as before (hart-rust-precedent, hart-comp, the three ISOs, qcow2-server,
      # docker-server); a workflow_dispatch can name any flake target, including the
      # raw INSTALLED images which are too expensive to build on every push.
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # raw-* only: put the ENTIRE nix store on the runner's second, nearly empty
      # ~65 GB data disk (/mnt), BEFORE the Nix installer runs. A raw image build
      # peaks at the closure PLUS the disk-image output, both in the store, which
      # does not fit the root disk however much preinstalled bloat is stripped.
      # release.yml learned this on 2026-07-16 (run 29522446118: ENOSPC crashed the
      # nix daemon itself at 50 min, after the hostedtoolcache purge) and carries
      # the same step; this workflow never got it, so raw-desktop reproduced the
      # identical failure here, dying silently at 50 minutes in runs 30287421697
      # and 30296001550. The ISO legs stay on the root disk unchanged: their
      # squashfs peak fits and their cache behaviour is proven.
      - name: Move /nix to the /mnt data disk (raw only)
        if: startsWith(matrix.target, 'raw-')
        run: |
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          df -h / /mnt

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            # `fallback = true`: on a genuine substituter MISS (path not in
            # cache.nixos.org), build from source instead of erroring.
            fallback = true

      # magic-nix-cache-action was REMOVED here (it used to follow). In THIS org it
      # is unauthenticated (logs "Cannot find netrc credentials for api.flakehub.com")
      # and the GitHub Actions Cache THROTTLES its local narinfo proxy mid-build —
      #   error: unable to download 'http://127.0.0.1:.../….narinfo': HTTP error 418
      #          GitHub Actions Cache throttled Magic Nix Cache.
      # A 418 from a configured substituter is a HARD transport error that aborts the
      # build REGARDLESS of `fallback` (fallback only covers a clean miss, not a 418),
      # so the throttle was randomly red-failing otherwise-fine jobs (hart-rust-
      # precedent + docker-server died on it while hart-comp passed, purely by timing).
      # Dropping the action leaves cache.nixos.org (configured by nix-installer-action)
      # as the sole substituter + local source builds — slower on cold paths but
      # RELIABLE, no throttling proxy to abort the Rust compiles. Re-add only once the
      # org has working FlakeHub/cache auth.

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /

      - name: Build ${{ matrix.target }}
        working-directory: nixos
        run: |
          # pipefail is MANDATORY: `nix build … | tee` otherwise reports tee's exit
          # (0) and the job goes green even when nix FAILED — this masked a real
          # hart-comp buildInputs eval error ("'libseat' renamed to 'seatd'") as a
          # passing build. With pipefail a nix failure red-fails the job (applies to
          # every matrix target, not just the Rust crates).
          set -o pipefail
          echo "Building: nix build .#${{ matrix.target }}"
          echo ""
          # -L / --print-build-logs: stream the FULL builder output instead of the
          # 25-line tail nix prints on failure. raw-desktop failed after 54 minutes
          # (2026-07-27, run 30263310599) having built the whole closure, the UKI and
          # both filesystems, and the only thing nix showed was 25 lines of trailing
          # mke2fs progress -- the actual error had scrolled out of that window. A
          # build worth 54 minutes deserves a readable failure the first time.
          time nix build .#${{ matrix.target }} -L --no-link --print-out-paths | tee /tmp/build-output.txt
          echo ""
          echo "Build successful!"

      - name: Compute checksum
        run: |
          BUILD_PATH=$(cat /tmp/build-output.txt | head -1)
          echo "Build path: $BUILD_PATH"
          echo ""

          # Find the primary output file
          if [[ -d "$BUILD_PATH/iso" ]]; then
            FILE=$(ls "$BUILD_PATH/iso/"*.iso 2>/dev/null | head -1)
          elif [[ -d "$BUILD_PATH" ]]; then
            FILE=$(find "$BUILD_PATH" -maxdepth 2 -type f \
              \( -name "*.iso" -o -name "*.qcow2" -o -name "*.raw" -o -name "*.tar.gz" \) \
              | head -1)
          fi

          if [[ -n "${FILE:-}" ]] && [[ -f "$FILE" ]]; then
            SIZE=$(du -h "$FILE" | cut -f1)
            SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
            echo "File: $(basename $FILE)"
            echo "Size: $SIZE"
            echo "SHA256: $SHA"
            echo ""
            echo "## Build: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
            echo "- **File**: \`$(basename $FILE)\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **SHA256**: \`$SHA\`" >> $GITHUB_STEP_SUMMARY

            # Create .torrent with web seed pointing to GitHub Release
            echo ""
            echo "Creating .torrent..."
            sudo apt-get install -y -qq mktorrent 2>/dev/null || true
            if command -v mktorrent &>/dev/null; then
              BASENAME=$(basename "$FILE")
              VERSION="${GITHUB_REF_NAME#v}"
              WEBSEED="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${BASENAME}"
              # Write to /tmp (writable) — "$FILE" lives in /nix/store, which is
              # read-only, so `-o "${FILE}.torrent"` failed with "Permission
              # denied" and red-failed every iso/qcow2 job even though the image
              # itself built fine (#69).
              mktorrent -l 22 \
                -c "HART OS — Hevolve Hive Agentic Runtime" \
                -w "$WEBSEED" \
                -o "/tmp/${BASENAME}.torrent" \
                "$FILE"
              echo "- **Torrent**: \`${BASENAME}.torrent\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Web Seed**: \`$WEBSEED\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No output file found (may be a derivation-only build)"
          fi

      - name: Upload artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hart-os-${{ matrix.target }}
          path: |
            /tmp/build-output.txt
            /tmp/*.torrent
          retention-days: 7

  # ─── Summary ───────────────────────────────────────────────
  summary:
    name: Build Summary
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "## HART OS Build Matrix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All builds completed. Check individual job logs for details." >> $GITHUB_STEP_SUMMARY
