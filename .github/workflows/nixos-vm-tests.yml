name: NixOS VM Tests (execute)

# ═══════════════════════════════════════════════════════════════════════════
# RETIRED AS AN IMPLEMENTATION — this now DELEGATES to flake-checks.yml.
# ═══════════════════════════════════════════════════════════════════════════
#
# This workflow used to carry its own HAND-WRITTEN list of check attributes
# and build them in ONE job. That was a parallel path: flake-checks.yml's
# `nixos-tests` job enumerates EVERY check dynamically —
#     nix eval .#checks.x86_64-linux --apply builtins.attrNames
# — and round-robins them across 4 shards, so nothing can drift out of the set.
# Its own header names what it replaced: "never a hand-picked subset that
# silently drifts out of date (the gap the old nixos-vm-tests.yml left)".
#
# Two implementations of "run the nixosTests" drifted exactly as you would
# expect, and the drift was expensive:
#
#   * THE LIST FELL BEHIND. 31 of 53 defined checks were absent from it. The
#     guard written to watch that gap (TestEveryNixosTestIsActuallyBuilt)
#     measured this SUBSET and read as though it measured coverage, which
#     pushed people toward growing the list — the exact wrong direction.
#
#   * GROWING IT BROKE CI. At 23 VM images in a single job the runner was LOST
#     twice, 27 minutes in, with an EMPTY conclusion on both the build step and
#     its `if: always()` disk report (an always() step runs on cancellation but
#     not when the runner is gone). Disk was ruled out with numbers: 115G free
#     of 145G, measured immediately before the build. Runs 30779764495 and
#     30781499301.
#
# So there is now ONE implementation. Dispatching this runs the FULL gate —
# every nixosTest, sharded, plus the python/cargo/compositor jobs — which is
# strictly more than the old subset and, unlike it, actually finishes.
#
# The trigger stays workflow_dispatch so existing muscle memory still works.
# flake-checks.yml also runs nightly on main (cron 03:00 UTC) and on PRs and
# from release.yml, so main is gated whether or not anyone dispatches this.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No concurrency group here, and none in flake-checks.yml either: a manual
  # dispatch must not be cancelled by the nightly, nor the nightly by a
  # dispatch. Both are answers somebody asked for. (A ref-only group is what
  # made a week of runs unattributable — see 3f5ee290.)
  gate:
    name: Full gate (delegated to flake-checks.yml)
    uses: ./.github/workflows/flake-checks.yml
