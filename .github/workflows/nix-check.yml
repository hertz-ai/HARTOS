name: Nix Lint & Evaluate

# Fast feedback: runs in ~30 seconds
# Catches syntax errors, unused code, and evaluation failures
# before the expensive 30-60 min ISO build.

on:
  workflow_dispatch:
  push:
    paths:
      - 'nixos/**'
      - 'deploy/distro/**'
  pull_request:
    paths:
      - 'nixos/**'
      - 'deploy/distro/**'

concurrency:
  # Push/PR runs share one group per ref and still cancel each other: on a busy
  # branch only the newest commit is worth checking.
  #
  # A workflow_dispatch gets its OWN group (keyed by run id) so a MANUAL,
  # on-demand run is never cancelled by a later push. Same fix already applied
  # to nix-build-matrix.yml; this workflow was missed, and it is the one that
  # produces the diagnostic output.
  #
  # Why it matters (2026-07-31): six attempts to get an attributed result for
  # ❌ hart-desktop-shell-boot / hart-layer-shell-host-paint produced FIVE
  # cancellations. Determinate Nix prints its error summary at the END of a
  # run, so a cancelled run shows the ❌ with no cause — which is exactly why
  # task #15 has read "red every run, NOT flake" since 07-26. Several sessions
  # push to main; any push killed the run mid-flight. The symptom looked like
  # a persistent failure rather than a cancellation.
  group: nix-check-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  # ─── Static Analysis (3 seconds) ───────────────────────────
  lint:
    name: Nix Lint (statix + deadnix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run statix (antipattern detection)
        # DeterminateSystems installer ships flakes-only — no `nixpkgs`
        # channel attribute is registered, so `nix-env -iA nixpkgs.X`
        # fails with `attribute 'nixpkgs' in selection path 'nixpkgs.X'
        # not found`.  Use the flake form against the pinned input.
        run: |
          nix profile install nixpkgs#statix
          echo "::group::statix results"
          # --config statix.toml (repo root) mutes three pure-style lints that
          # fire on HART's deliberate flat-attribute idiom; statix still gates
          # on genuine antipatterns. See statix.toml for the rationale.
          statix check --config statix.toml nixos/ 2>&1 || true
          echo "::endgroup::"
          # Fail on errors, warn on suggestions
          statix check --config statix.toml nixos/

      - name: Run deadnix (unused code detection)
        run: |
          nix profile install nixpkgs#deadnix
          echo "::group::deadnix results"
          # --no-lambda-arg / --no-lambda-pattern-names: ignore unused names in
          # NixOS module signatures (`{ config, lib, pkgs, ... }:` where not all
          # are referenced) — idiomatic, not dead code. Real dead `let`/binding
          # findings still fail the job.
          deadnix --no-lambda-arg --no-lambda-pattern-names nixos/ 2>&1 || true
          echo "::endgroup::"
          deadnix --no-lambda-arg --no-lambda-pattern-names nixos/

  # ─── Flake Evaluation ──────────────────────────────────────
  # The old header said "10-30 seconds" and the cap was 10 minutes. Full
  # evaluation now takes LONGER than that cap (task #23: the eval gate went
  # from ~2.5min to >15min after the installer / Calamares / dev-tools
  # commits), so every run was KILLED MID-EVALUATION.
  #
  # That is why task #15 has read "red every run, NOT flake" since 07-26:
  # Determinate Nix prints its error summary at the END of a run, so a run
  # killed at the cap shows a ❌ with NO cause, indistinguishable from a
  # persistent failure. Six diagnostic attempts on 2026-07-31 produced zero
  # attributions for exactly this reason.
  #
  # Raised to 45 so a run can REACH its summary. This is a diagnosis
  # unblocker, not a fix for the slowness — task #23 owns bisecting the
  # eval-time regression itself, and this cap should come back down once
  # that lands.
  flake-check:
    name: Nix Flake Check (full evaluation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Evaluate all flake outputs
        working-directory: nixos
        run: |
          # INSTRUMENTED 2026-08-02 (task #23). This step has been dying with
          # `Process completed with exit code 143` (SIGTERM) roughly six
          # minutes in, WELL inside the 45-minute job cap and with no timeout
          # wrapper of its own. Because Determinate Nix prints its error
          # summary at the END of a run, every death left the two real
          # failures (hart-desktop-shell-boot, hart-layer-shell-host-paint)
          # showing ❌ with no cause — which is the whole reason task #15 read
          # "red every run" for a week.
          #
          # Ruled out already: concurrency cancellation (3f5ee290, log shows
          # zero cancels) and the job timeout (dee36039, raised to 45min).
          #
          # ── MEMORY: NO LONGER A HYPOTHESIS. MEASURED 2026-08-18 ──────────
          # The sampler was made to STREAM (see the note above it) and the very
          # next run, 32125200674, finally caught the death in the log:
          #     [mem] 10:09:54 used=15253MB avail=735MB
          #     [mem] 10:10:04 used=15767MB avail=220MB
          #     [mem] 10:10:15 used=15816MB avail=172MB
          #     [mem] 10:10:25 used=15969MB avail=18MB
          #     [mem] 10:10:41 used=15983MB avail=5MB
          #     ##[error]Process completed with exit code 143
          # 16GB runner walked to 5MB available and died at 4m02s. The last
          # gap is 16s against a 10s sleep, i.e. the SAMPLER ITSELF could not
          # be scheduled. That also settles the 143-not-137 question this
          # comment used to raise: there was never an OOM kill to find,
          # because nothing got cleanly killed. The runner thrashed itself
          # unresponsive and GitHub terminated the job, exactly as the
          # timeout-wrapper note below guessed.
          #
          # THE FIX IS TO SPLIT, NOT TO RAISE ANYTHING. `nix flake check`
          # evaluates every output in ONE process and holds the whole graph:
          # ~40 VM checks plus full nixosConfigurations. The diagnose job at
          # the bottom of this file already proves the shape of the answer:
          # evaluating attribute by attribute, a FRESH `nix eval` per attr,
          # releases memory between them and COMPLETES in ~15 minutes on the
          # same runner. Whoever does that split must keep the coverage
          # identical: a split that quietly evaluates fewer outputs than
          # `nix flake check` did would be a false green, which is strictly
          # worse than the honest red it replaced.
          set +e
          echo "::group::Runner capacity"
          free -m; nproc; df -h /
          echo "::endgroup::"

          # Sample memory every 10s so the peak is visible even if the
          # process is killed without a chance to report.
          #
          # STREAM IT (2026-08-18, run 32113023595). A file the log only reads
          # AFTERWARDS is not evidence that survives: that run lost the RUNNER,
          # not just the step, so "Memory + OOM evidence (survives cancellation)"
          # was SKIPPED along with every Post step, and the samples it had been
          # faithfully collecting went into /tmp and died there. `if: always()`
          # covers cancellation, NOT a runner that stops existing -- the same
          # trap this sampler was written to escape, one level up.
          # tee keeps the file for the peak/sort below AND puts every sample in
          # the step log AS IT IS TAKEN, so the last line before the runner
          # disappears is the measurement. Interleaving with the nix output is
          # the point: it timestamps the death against the eval that caused it.
          # Process substitution, NOT a pipe: in a pipeline `$!` is the LAST
          # command (tee), so `kill "$SAMPLER"` below would kill the writer and
          # leave the loop running until its next SIGPIPE. This keeps $! meaning
          # the sampler itself, which is what that kill has always assumed.
          ( while true; do
              printf '[mem] %s %s\n' "$(date -u +%H:%M:%S)" \
                "$(free -m | awk '/^Mem:/{printf "used=%sMB avail=%sMB", $3, $7}')"
              sleep 10
            done ) > >(tee /tmp/memsample.log) 2>&1 &
          SAMPLER=$!

          # WHY A timeout WRAPPER (2026-08-03, run 30781405882): the step died
          # again, and this time the cap was NOT the cause — the job ran
          # 14m48s against a 45-minute limit, and NO push landed in the window
          # (checked: nothing between 72e18952 at 03:16 and f89ab63d at 03:36),
          # so it was neither the job timeout nor concurrency. The log simply
          # STOPS after `evaluating 'checks.x86_64-linux.hart-portal-
          # screencast'` and says nothing for 12m13s before "The operation was
          # canceled". Twelve minutes of total silence is a stall, and the
          # absence of a 137 argues against a clean OOM kill; a runner
          # thrashing itself unresponsive fits both facts.
          #
          # An explicit timeout turns that into a self-naming 124 instead of a
          # mystery cancellation, and — crucially — lets the lines BELOW run.
          timeout --signal=TERM --kill-after=60 1500 nix flake check --no-build 2>&1
          RC=$?

          kill "$SAMPLER" 2>/dev/null || true
          echo "::group::Memory during evaluation (peak last)"
          sort -t= -k2 -n /tmp/memsample.log 2>/dev/null | tail -5
          echo "--- final ---"
          free -m
          echo "::endgroup::"

          # 143 = 128+15 (SIGTERM), 137 = 128+9 (SIGKILL/OOM). Naming them
          # means the NEXT failure is self-describing instead of a bare code.
          case "$RC" in
            0)   echo "All flake outputs evaluate successfully." ;;
            137) echo "::error::eval SIGKILLed (137) — OOM killer. Confirms the memory hypothesis; split the check or raise the runner." ;;
            124) echo "::error::eval hit OUR 25-minute wrapper (124) — it stalled rather than failed. The memory table above is now the evidence; a flat curve exonerates memory and points at the Nix daemon." ;;
            143) echo "::error::eval SIGTERMed (143) — the KNOWN, MEASURED failure: the runner ran out of memory and was terminated (run 32125200674 hit avail=5MB of 16GB). Read the [mem] samples above to confirm; if they walk to near zero this is it. Fix is to SPLIT the evaluation per attribute (see the note on this step), not to raise a cap." ;;
            *)   echo "::error::eval failed rc=$RC — a real evaluation failure; the summary above names the outputs." ;;
          esac
          exit "$RC"

      # The sampler above only ever printed when `nix flake check` RETURNED.
      # Run 30781405882 was CANCELLED mid-eval, so the kill, the sort and the
      # whole ::group:: never ran and every sample it had faithfully collected
      # for 12 minutes was thrown away at the moment it finally mattered.
      # A diagnostic that dies with the thing it is diagnosing is not a
      # diagnostic. This step runs on cancellation too.
      - name: Memory + OOM evidence (survives cancellation)
        if: always()
        run: |
          echo "::group::Memory samples (chronological — watch the trend, not the peak)"
          tail -60 /tmp/memsample.log 2>/dev/null || echo "no samples: the step died before the sampler wrote"
          echo "::endgroup::"
          echo "::group::Peak sample"
          sort -t= -k2 -n /tmp/memsample.log 2>/dev/null | tail -3 || true
          echo "::endgroup::"
          echo "::group::Kernel OOM verdict"
          # The one fact that separates "thrashed itself unresponsive" from
          # "something else killed it". dmesg needs no root on hosted runners.
          (dmesg -T 2>/dev/null || sudo dmesg -T 2>/dev/null || true) \
            | grep -iE "out of memory|oom-kill|killed process" | tail -20 \
            || echo "no OOM lines in dmesg — memory did NOT kill it"
          echo "::endgroup::"
          free -m; df -h /

      - name: Show flake metadata
        working-directory: nixos
        run: |
          echo "::group::Flake outputs"
          nix flake show 2>&1
          echo "::endgroup::"

  # ─── Targeted failure diagnosis (own job, on purpose) ──────
  # This lives in a SEPARATE job from flake-check, not as a step inside it.
  # As a step it was useless in practice: GitHub only serves a job's log blob
  # after the JOB finishes, so a 2-minute diagnostic sat unreadable behind a
  # 45-minute full evaluation. Its whole value is being readable FAST.
  # It also never gates — see exit 0 below.
  diagnose-failing-checks:
    name: Diagnose known-failing checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Evaluate each failing check by name
        working-directory: nixos
        run: |
          # WHY THIS RUNS BEFORE THE FULL CHECK (task #23 -> #15):
          # `nix flake check` evaluates every output in one process and no
          # longer finishes inside 45 minutes, and Determinate Nix prints its
          # error summary only at the END. So the two checks that actually
          # fail have never had their CAUSE reported — six diagnostic attempts
          # produced a bare ❌ each time.
          #
          # Evaluating them by NAME takes seconds and cannot be starved by the
          # other ~40 outputs. `.drvPath` forces full evaluation of the
          # derivation without building it, so an eval error surfaces here.
          #
          # `exit 0` deliberately: this step exists to REPORT, never to gate.
          # The real pass/fail verdict stays with the full check below, so a
          # diagnostic aid can never mask or invent a build result.
          set +e
          FAILED_CHECKS="hart-desktop-shell-boot hart-layer-shell-host-paint"
          for c in $FAILED_CHECKS; do
            echo "::group::eval checks.x86_64-linux.$c"
            nix eval ".#checks.x86_64-linux.$c.drvPath" --raw 2>&1 | tail -60
            echo ""
            echo "(rc above is from the eval of $c)"
            echo "::endgroup::"
          done

          # ── Per-check TIMING (task #23) ───────────────────────────────
          # #23 needs to know WHICH output made full evaluation outgrow every
          # cap we set. `nix flake check` is one opaque process, so it can
          # only be timed as a whole — which tells you nothing actionable.
          # Timing each check separately localises the cost, and that IS the
          # bisect #23 has been asking for since it was filed.
          #
          # Printed INCREMENTALLY and unsorted-as-we-go: if this job hits its
          # own 20min cap, the lines already emitted still name the expensive
          # attributes. A sort-at-the-end would lose exactly the data we came
          # for, which is the same "summary only at the END" trap that hid
          # #15 for a week.
          echo "::group::Per-check evaluation time (incremental; slowest matter)"
          ATTRS=$(nix eval --impure --raw --expr \
            'builtins.concatStringsSep " " (builtins.attrNames (builtins.getFlake (toString ./.)).checks.x86_64-linux)' \
            2>/dev/null)
          if [ -z "$ATTRS" ]; then
            echo "(could not enumerate checks — skipping timing, not failing)"
          else
            for a in $ATTRS; do
              s=$(date +%s)
              nix eval ".#checks.x86_64-linux.$a.drvPath" --raw >/dev/null 2>&1
              rc=$?
              printf '%5ss  rc=%s  %s\n' "$(( $(date +%s) - s ))" "$rc" "$a"
            done
          fi
          echo "::endgroup::"
          exit 0


  # ─── Python Structural Validation ──────────────────────────
  python-tests:
    name: NixOS Config Structural Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pytest + project deps
        # tests/conftest.py imports lifecycle_hooks → core.session_cache →
        # core/__init__.py → core.http_pool → requests, so pytest cannot
        # collect the test file without the project's runtime deps installed.
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run NixOS config tests
        run: pytest tests/unit/test_nixos_configs.py -v
