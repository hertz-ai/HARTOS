name: E2E OS Test

# Builds HART OS ISO from NixOS flake, boots in QEMU, runs smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'nixos/**'
      - 'deploy/distro/**'
      - 'deploy/linux/**'
      - 'tests/e2e-os-smoke.sh'
      - 'tests/boot-qemu-for-test.sh'

concurrency:
  group: e2e-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Fast Gate: flake evaluation (30s) ─────────────────────
  flake-check:
    name: Flake Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            narinfo-cache-negative-ttl = 0
            max-jobs = 2
            cores = 2
      # magic-nix-cache dropped: under sustained load the CDN returns
      # < 1 byte/sec and stalls for 300s (seen 13:30-14:04 on run
      # 24629754670). cache.nixos.org has no such throttling.

      # Scope evaluation to the x86_64-linux ISO targets this
      # workflow actually builds. `nix flake check` has been broken
      # for months on an upstream mobile-nixos module-option drift
      # in `sd-phone` — unrelated to e2e-server / e2e-desktop — and
      # gating on it skipped every e2e boot test since 2026-03.
      - name: Evaluate e2e target flake outputs
        working-directory: nixos
        run: |
          set -eo pipefail
          # raw-desktop = the INSTALLED (writable-root) image the desktop USB
          # actually ships as of 2026-07-16; evaluating it here is the gate that
          # proves the hartImageKind split evals BOTH ways (the iso targets in
          # the same loop re-prove the ISO path did not regress).
          for t in iso-server iso-desktop raw-desktop; do
            echo "=== Evaluating .#packages.x86_64-linux.$t ==="
            nix eval ".#packages.x86_64-linux.${t}.drvPath" --raw
            echo
          done

  # ─── E2E: Server Variant ───────────────────────────────────
  e2e-server:
    name: E2E Server (build + boot + smoke)
    needs: flake-check
    runs-on: ubuntu-latest
    # The HARTOS-specific derivations + squashfs ISO assembly build from scratch
    # each run (they aren't in cache.nixos.org; magic-nix-cache was dropped over
    # CDN throttling — see note below), so the cold build eats most of a short
    # budget and the boot+smoke phase gets killed by the job wall-clock before
    # the backend comes up. Give boot real headroom so this job validates.
    timeout-minutes: 100
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            narinfo-cache-negative-ttl = 0
            max-jobs = 2
            cores = 2
      # magic-nix-cache dropped: under sustained load the CDN returns
      # < 1 byte/sec and stalls for 300s (seen 13:30-14:04 on run
      # 24629754670). cache.nixos.org has no such throttling.

      - name: Install QEMU and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils sshpass

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | \
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          ls -la /dev/kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y && sudo apt-get clean

      - name: Build HART OS ISO (server variant)
        working-directory: nixos
        run: |
          nix build .#iso-server --no-link --print-out-paths | tee /tmp/iso-path.txt
          ISO_DIR=$(cat /tmp/iso-path.txt)
          echo "ISO_PATH=$(ls ${ISO_DIR}/iso/*.iso)" >> $GITHUB_ENV

      - name: Boot ISO in QEMU
        run: |
          chmod +x tests/boot-qemu-for-test.sh
          # 8G headroom for the backend's raised MemoryMax (4G server) — the
          # default 4096 would OOM the 4G cgroup + the OS and fail thread allocs.
          QEMU_RAM=8192 QEMU_CPUS=4 \
            bash tests/boot-qemu-for-test.sh "$ISO_PATH"

      - name: Run E2E smoke tests (15 checks)
        run: |
          chmod +x tests/e2e-os-smoke.sh
          bash tests/e2e-os-smoke.sh

      - name: Run sandbox validation inside VM
        run: |
          sshpass -p 'hart' ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -p 10022 hart-admin@localhost \
            'sudo hart sandbox test-all 2>&1' \
            | tee /tmp/hart-sandbox-results.txt || true

      - name: Collect guest logs on failure
        if: failure()
        run: |
          sshpass -p 'hart' ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -p 10022 hart-admin@localhost \
            'sudo journalctl -u "hart-*" --no-pager -n 300' \
            > /tmp/hart-guest-logs.txt 2>&1 || true
          cp /tmp/hart-qemu-boot.log /tmp/hart-qemu-log.txt 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hart-e2e-server-logs
          path: |
            /tmp/hart-guest-logs.txt
            /tmp/hart-qemu-log.txt
            /tmp/hart-sandbox-results.txt
          if-no-files-found: ignore

      - name: Shutdown QEMU
        if: always()
        run: |
          if [[ -f /tmp/hart-qemu-test.pid ]]; then
            kill "$(cat /tmp/hart-qemu-test.pid)" 2>/dev/null || true
          fi
          rm -f /tmp/hart-qemu-test.pid /tmp/hart-test-disk.qcow2

  # ─── E2E: Desktop Variant ──────────────────────────────────
  e2e-desktop:
    name: E2E Desktop (build + boot + subsystem check)
    needs: flake-check
    runs-on: ubuntu-latest
    # The desktop ISO is large and its HARTOS-specific derivations + squashfs
    # assembly build from scratch each run (not in cache.nixos.org), so the cold
    # build ran ~54 min and left the 90-min budget too tight — the boot was
    # killed at the job wall-clock while still waiting for :6777, so the
    # service/branding checks never ran (observed run 26974741320). 160 min
    # gives the slow shared-runner boot + checks room to complete.
    timeout-minutes: 160
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            narinfo-cache-negative-ttl = 0
            max-jobs = 2
            cores = 2
      # magic-nix-cache dropped: under sustained load the CDN returns
      # < 1 byte/sec and stalls for 300s (seen 13:30-14:04 on run
      # 24629754670). cache.nixos.org has no such throttling.

      - name: Install QEMU and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils sshpass

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | \
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          ls -la /dev/kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y && sudo apt-get clean

      - name: Build HART OS ISO (desktop variant)
        working-directory: nixos
        run: |
          nix build .#iso-desktop --no-link --print-out-paths | tee /tmp/iso-path.txt
          ISO_DIR=$(cat /tmp/iso-path.txt)
          echo "ISO_PATH=$(ls ${ISO_DIR}/iso/*.iso)" >> $GITHUB_ENV

      - name: Boot Desktop ISO in QEMU (with virtual GPU)
        run: |
          chmod +x tests/boot-qemu-for-test.sh
          # 8G: the backend's raised MemoryMax (3G desktop) + the glass shell +
          # the other hart services need headroom or thread-stack allocs fail.
          QEMU_RAM=8192 QEMU_CPUS=4 \
            bash tests/boot-qemu-for-test.sh "$ISO_PATH"

      - name: Run E2E smoke tests (15 checks)
        run: |
          chmod +x tests/e2e-os-smoke.sh
          bash tests/e2e-os-smoke.sh

      - name: Desktop-specific checks
        run: |
          SSH_CMD="sshpass -p hart ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 10022 hart-admin@localhost"

          echo "Checking desktop-specific components..."

          # Check Wine is installed
          $SSH_CMD "which wine64 || which wine" && echo "PASS: Wine available" || echo "FAIL: Wine not found"

          # Check Flatpak is installed
          $SSH_CMD "which flatpak" && echo "PASS: Flatpak available" || echo "FAIL: Flatpak not found"

          # Check display manager
          $SSH_CMD "systemctl is-active display-manager.service" && echo "PASS: Display manager running" || echo "WARN: Display manager not active"

          # Check Conky config exists
          $SSH_CMD "find /nix/store -name 'hart.conkyrc' -print -quit 2>/dev/null | grep -q ." && echo "PASS: Conky config deployed" || echo "WARN: Conky config not found"

          # AI-native session services — the #99 fix. These are Type=notify
          # units that die on a fresh ISO without systemd-python in the hart
          # python env. Informational (matches the smoke convention); the
          # gating guard is nixos/tests/vm-tests.nix hart-desktop-boot.
          $SSH_CMD "systemctl is-active hart-model-bus.service"  && echo "PASS: Model Bus active"      || echo "FAIL: Model Bus down (check systemd-python)"
          $SSH_CMD "systemctl is-active hart-liquid-ui.service"  && echo "PASS: LiquidUI server active" || echo "FAIL: LiquidUI down (check systemd-python)"
          $SSH_CMD "systemctl is-active hart-app-bridge.service" && echo "PASS: App Bridge active"     || echo "FAIL: App Bridge down (check systemd-python)"

          # Android-on-Linux branding: the installer 'nixos' user must be a
          # hidden system account (uid < 1000) so GDM never lists it — #101.
          $SSH_CMD 'test "$(id -u nixos)" -lt 1000' && echo "PASS: nixos user hidden (system uid)" || echo "FAIL: nixos user still visible on greeter"

          # Glass-shell GI typelibs present (#99/#100) — WebKit2 must be in the
          # closure or the shell window can't render.
          $SSH_CMD "find /nix/store -name 'WebKit2-4.1.typelib' -print -quit 2>/dev/null | grep -q ." && echo "PASS: WebKit2 typelib present" || echo "FAIL: WebKit2 typelib missing"

      - name: Run sandbox validation inside VM
        run: |
          sshpass -p 'hart' ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -p 10022 hart-admin@localhost \
            'sudo hart sandbox test-all 2>&1' \
            | tee /tmp/hart-sandbox-desktop.txt || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hart-e2e-desktop-logs
          path: |
            /tmp/hart-qemu-boot.log
            /tmp/hart-sandbox-desktop.txt
          if-no-files-found: ignore

      - name: Shutdown QEMU
        if: always()
        run: |
          if [[ -f /tmp/hart-qemu-test.pid ]]; then
            kill "$(cat /tmp/hart-qemu-test.pid)" 2>/dev/null || true
          fi
          rm -f /tmp/hart-qemu-test.pid /tmp/hart-test-disk.qcow2
