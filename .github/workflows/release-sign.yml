name: Sign Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # NEVER cancel a signing run mid-flight.
  # Same shape as nix-check/coverage-baseline (3f5ee290): a manual
  # workflow_dispatch gets its OWN group keyed by run id, so an
  # on-demand run is never cancelled by an unrelated later push.
  group: release-sign-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: false

jobs:
  sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install cryptography

      - name: Compute code hash
        id: hash
        run: |
          CODE_HASH=$(python -c "
          import sys; sys.path.insert(0, '.')
          from security.node_integrity import compute_code_hash, compute_file_manifest
          import hashlib, json
          ch = compute_code_hash()
          fm = compute_file_manifest()
          mh = hashlib.sha256(json.dumps(fm, sort_keys=True).encode()).hexdigest()
          print(f'{ch}|{mh}')
          ")
          echo "code_hash=$(echo $CODE_HASH | cut -d'|' -f1)" >> $GITHUB_OUTPUT
          echo "manifest_hash=$(echo $CODE_HASH | cut -d'|' -f2)" >> $GITHUB_OUTPUT

      - name: Sign release manifest
        env:
          MASTER_PRIVATE_KEY_HEX: ${{ secrets.HEVOLVE_MASTER_PRIVATE_KEY_HEX }}
        run: |
          python scripts/sign_release.py \
            --version ${{ github.ref_name }} \
            --git-sha ${{ github.sha }} \
            --code-hash ${{ steps.hash.outputs.code_hash }} \
            --manifest-hash ${{ steps.hash.outputs.manifest_hash }} \
            --output release_manifest.json

      - name: Verify signature (sanity check)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from security.master_key import load_release_manifest, verify_release_manifest
          m = load_release_manifest()
          assert m, 'Manifest not found'
          assert verify_release_manifest(m), 'Signature verification failed'
          print(f'Verified: version={m[\"version\"]}, hash={m[\"code_hash\"][:16]}...')
          "

      - name: Upload release manifest
        uses: softprops/action-gh-release@v2
        with:
          files: release_manifest.json

      # Populate the release-hash registry that SHIPS with every build.
      #
      # The signed manifest above is central-only; desktops trust peers via
      # security/release_hash_registry.py:_KNOWN_HASHES — and that dict
      # shipped EMPTY because nothing ever ran update_release_hashes.py
      # (its docstring always said this workflow should, before signing).
      # Result, measured on the LAN 2026-08-22: every same-network peer
      # admitted as untrusted (master_key_verified=False) because no node
      # had any trust basis at all.
      #
      # ALL official tags are hashed, not just this one — peers legitimately
      # run older shipped versions and every one of them must verify.  The
      # updated registry is committed back to main so the NEXT builds carry
      # it; this tag's own hash becomes verifiable to the fleet from the
      # next release on (a self-hashing tree cannot contain its own hash,
      # same reason a git commit cannot contain its own sha).
      - name: Update release-hash registry on main
        run: |
          git config user.name "hartos-release-bot"
          git config user.email "release-bot@hertzai.com"
          git fetch origin main
          git checkout main
          python scripts/update_release_hashes.py
          if git diff --quiet security/release_hash_registry.py; then
            echo "registry unchanged — nothing to commit"
          else
            git add security/release_hash_registry.py
            git commit -m "chore(security): registry knows release ${{ github.ref_name }} (all official tags rehashed)"
            git push origin main
          fi
