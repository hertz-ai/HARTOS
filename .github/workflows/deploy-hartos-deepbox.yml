name: Deploy HARTOS Deepbox

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy to the box at a time.
#
# Without this, every push starts its own run and they build concurrently on
# the SAME machine. Each is a --no-cache build of an ~8.7GB image, and three
# pushes in half an hour on 23 July put two of them in the build phase
# together: deepbox ran out of memory and the older build was SIGKILLed
# mid-step, surfacing as the useless "Process exited with status 137". Two of
# that day's three deploy failures look like this. It reads as a flaky build
# and is really just two builds competing for one box.
#
# cancel-in-progress because an in-flight build for an older commit has no
# value once a newer one exists -- it would only deploy code that is already
# superseded. This is safe now that the container is not torn down until its
# replacement is built and healthy: cancelling mid-build leaves the previous
# release serving :6777, untouched. Under the old remove-first ordering the
# same cancellation would have left the box with nothing running.
concurrency:
  group: deploy-hartos-deepbox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on Deepbox
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 60m
          command_timeout: 120m
          # The deploy logic lives in deploy/deepbox_deploy.sh (in the repo,
          # synced by the reset below).  Any `with:` value carrying ${{ }}
          # expressions compiles to ONE GitHub expression hard-capped at
          # 21,000 COMPILED chars (escaping inflates raw text; raw 20,966
          # was rejected 2026-08-24, run 32754055050 — third collision).
          # This bootstrap stays tiny; config flows via `envs:` below.
          # oauth.env is written HERE because the secret is multiline and
          # heredoc interpolation is the safe transport for it.
          envs: DEPLOY_LOGS_PATH,DEPLOY_IMAGES_PATH,DEPLOY_MASTER_KEY_PATH,DEPLOY_ADVERTISE_URL,DEPLOY_AGENT_DATA_PATH,LLM_GATEWAY_URL,HEVOLVE_LLM_ENDPOINT_URL,HEVOLVE_LLM_MODEL_NAME,HEVOLVE_LLM_API_KEY,GROQ_API_KEY,LANGCHAIN_API_KEY,ALLOWED_HOSTS,CORS_ORIGINS,HART_OTA_HOST,HEVOLVE_ENFORCEMENT_MODE,HEVOLVE_NODE_TIER,LANGCHAIN_PROJECT
          script: |
            set -e
            cd ${{ secrets.DEPLOY_REPO_PATH }}
            # One deploy at a time ON THE BOX. cancel-in-progress above cancels
            # the GitHub run, not this shell: appleboy/ssh-action leaves the
            # remote bash running. On 2026-09-22 a cancelled run's script and
            # the next run's script ran interleaved on one machine: two
            # --no-cache builds at once, and the older script booted its image
            # AFTER the newer checkout, which poisoned the code-hash cache in
            # the shared agent_data mount and took central down for 41 min
            # (#133). The lock is taken here, before the checkout, on an fd
            # that deepbox_deploy.sh inherits, so it covers the reset, the
            # build, the run and the rollback branch. A second run waits and
            # says who it waits for; every run deploys origin/main's tip at the
            # moment it starts, so a run that waited never deploys stale code.
            # The wait is bounded below the job's 120m command_timeout so the
            # log names the cause instead of a silent kill.
            DEPLOY_LOCK=/tmp/deepbox_deploy.lock
            exec 9>"$DEPLOY_LOCK"
            if ! flock -n 9; then
              _holder="$(cat "$DEPLOY_LOCK.holder" 2>/dev/null || echo unknown)"
              echo "deploy.lock held by $_holder; waiting since $(date -u +%H:%M:%SZ)"
              _t0=$SECONDS
              flock -w 6600 9 || { echo "::error::deploy.lock still held by $_holder after $((SECONDS - _t0))s; giving up"; exit 1; }
              echo "deploy.lock acquired after $((SECONDS - _t0))s (was held by $_holder)"
            fi
            echo "run ${{ github.run_id }} sha ${{ github.sha }} since $(date -u +%H:%M:%SZ)" > "$DEPLOY_LOCK.holder"
            # sudo, and not a bare rm: release_manifest.json is written by
            # `sudo docker cp` in deepbox_deploy.sh, so it lands ROOT-owned,
            # and it is also a bind-mount source for the container. If the
            # host path is ever missing when the container starts, Docker
            # CREATES IT AS A ROOT-OWNED DIRECTORY, the container's manifest
            # then lands inside it as release_manifest.json/release_manifest.json,
            # and this line -- running as the deploy user -- can no longer
            # unlink it. With `set -e` that aborts the script BEFORE the
            # `git reset --hard origin/main` two lines down, so the checkout
            # silently freezes at whatever SHA was last deployed and every
            # later push appears to deploy while changing nothing.
            #
            # That is not hypothetical. Measured 2026-09-01: the box sat at
            # 3abea78b for hours with the workflow red on
            # "rm: cannot remove 'release_manifest.json/release_manifest.json':
            # Permission denied", while the directory's own contents named
            # "version": "3abea78b" -- the deploy was pinned by its own
            # leftover artifact. Four separate fixes were pushed and none
            # reached production.
            #
            # Only a DIRECTORY is removed. The file is the running container's
            # bind-mounted manifest: a container under enforcement=hard that
            # restarts with the file gone dies with "release_manifest.json
            # missing", every 12 seconds, until a deploy writes one. Measured
            # 2026-09-22 15:56Z: this line removed the file, the new image
            # failed its boot check, the rollback restarted the old image
            # without a manifest, and central was down for the rest of the
            # hour. deepbox_deploy.sh overwrites the file with the new
            # image's manifest at the moment it is ready.
            if [ -d release_manifest.json ]; then sudo rm -rf release_manifest.json; fi
            git fetch origin --prune
            git checkout main
            git reset --hard origin/main
            umask 077
            cat > oauth.env <<'OAUTH_EOF'
            ${{ secrets.HARTOS_OAUTH_ENV }}
            OAUTH_EOF
            sed -i 's/^[[:space:]]*//' oauth.env
            bash deploy/deepbox_deploy.sh
        env:
          DEPLOY_LOGS_PATH: ${{ secrets.DEPLOY_LOGS_PATH }}
          DEPLOY_IMAGES_PATH: ${{ secrets.DEPLOY_IMAGES_PATH }}
          DEPLOY_MASTER_KEY_PATH: ${{ secrets.DEPLOY_MASTER_KEY_PATH }}
          DEPLOY_ADVERTISE_URL: ${{ secrets.DEPLOY_ADVERTISE_URL }}
          DEPLOY_AGENT_DATA_PATH: ${{ secrets.DEPLOY_AGENT_DATA_PATH }}
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          # The ONE configured LLM for this node (core/autogen_config.py).
          # Absent secrets leave the box .env untouched; set, they are the
          # configuration and every deploy writes them into it.
          HEVOLVE_LLM_ENDPOINT_URL: ${{ secrets.HEVOLVE_LLM_ENDPOINT_URL }}
          HEVOLVE_LLM_MODEL_NAME: ${{ secrets.HEVOLVE_LLM_MODEL_NAME }}
          HEVOLVE_LLM_API_KEY: ${{ secrets.HEVOLVE_LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          HART_OTA_HOST: ${{ secrets.HART_OTA_HOST }}
          HEVOLVE_ENFORCEMENT_MODE: ${{ secrets.HEVOLVE_ENFORCEMENT_MODE }}
          HEVOLVE_NODE_TIER: ${{ secrets.HEVOLVE_NODE_TIER }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}