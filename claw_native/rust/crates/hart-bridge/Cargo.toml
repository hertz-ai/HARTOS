[package]
name = "hart-bridge"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "PyO3 bridge — exposes claw-code Rust tools to HARTOS Python agents"
publish = false

[lib]
name = "claw_bridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
tools = { path = "../tools" }
runtime = { path = "../runtime" }
api = { path = "../api" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
