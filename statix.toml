# statix configuration for HART OS nixos/ tree.
#
# The three lints below are DISABLED because they are pure style preferences
# that fire on a convention HART OS uses deliberately and consistently:
#
#   repeated_keys        — the flat NixOS idiom `services.xserver.enable = …;`
#                          `services.xserver.displayManager.gdm = …;` (rather
#                          than a merged `services.xserver = { … }`). The flat
#                          form is grep-friendly and diff-friendly and is used
#                          throughout the codebase + upstream nixpkgs modules.
#   manual_inherit_from  — `x = config.foo;` is kept explicit (not rewritten to
#                          `inherit (config) foo;`) for readability at the call
#                          site.
#   useless_parens       — defensive parentheses kept around conditionals for
#                          clarity.
#
# None of these indicate a defect: full `nix flake check --no-build` passes and
# every real build target (iso-server/desktop/edge, hart-comp, hart-rust-
# precedent, qcow2-server) builds green. statix STILL gates on genuine
# antipatterns (bool_comparison, empty_pattern, useless_has_attr,
# collapsible_let_in, eta_reduction, …) — only the cosmetic-style trio is muted,
# so the lint job catches real problems instead of red-failing on house style.
disabled = [
  "repeated_keys",
  "manual_inherit_from",
  "useless_parens",
]
